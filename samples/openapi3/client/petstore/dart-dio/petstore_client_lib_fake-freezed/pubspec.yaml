name: openapi
version: 1.0.0
description: OpenAPI API client
homepage: homepage


environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  dio: '^5.7.0'
  freezed_annotation: '^3.0.0'
  json_annotation: '^4.9.0'

dev_dependencies:
  build_runner: any
  freezed: '^3.0.0'
  json_serializable: '^6.9.3'
  # unlike the json_serializable variant, this one has no copy_with_extension_gen
  # whose source_gen constraint would hold source_helper back; source_helper 1.4.0
  # added extension members that clash with json_serializable 6.x's internal
  # copies and break the build_runner build script, so hold it below 1.4.0.
  # 1.3.9+ requires Dart 3.9 while this variant advertises >=3.8.0, so keep the
  # 1.3.8 lower bound resolvable for 3.8 users
  source_helper: '>=1.3.8 <1.4.0'
  test: '^1.16.0'
