openapi: 3.0.1
info:
  title: overlapping auth schemes test
  version: "1.0"
servers:
- url: http://localhost:8080/
security:
- basicAuth: []
- apiKeyAuth: []
- bearerAuth: []
paths:
  /ping:
    get:
      operationId: pingGet
      responses:
        "201":
          description: OK
components:
  schemas: {}
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http
    apiKeyAuth:
      in: header
      name: x-api-key
      type: apiKey
    bearerAuth:
      bearerFormat: token
      scheme: bearer
      type: http

