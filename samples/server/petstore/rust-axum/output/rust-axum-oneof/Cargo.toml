[package]
name = "rust-axum-oneof"
version = "0.0.1"
authors = ["OpenAPI Generator team and contributors"]
description = "No description provided (generated by Openapi Generator https://github.com/openapitools/openapi-generator)"
edition = "2024"
homepage = "https://github.com/openapitools/openapi-generator"

[features]
default = ["server"]
server = [
    "async-trait",
    "axum",
    "axum-extra",
    "futures-util",
    "headers",
    "http",
    "serde_html_form",
    "tokio",
    "tracing",
]
conversion = [
    "frunk",
    "frunk_derives",
    "frunk_core",
    "frunk-enum-core",
    "frunk-enum-derive",
]

[dependencies]
ammonia = "4"
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
axum-extra = { version = "0.12", features = [
  "cookie",
  "query",
  "typed-header",
], optional = true }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
frunk = { version = "0.4", optional = true }
frunk-enum-core = { version = "0.3", optional = true }
frunk-enum-derive = { version = "0.3", optional = true }
frunk_core = { version = "0.4", optional = true }
frunk_derives = { version = "0.4", optional = true }
futures-util = { version = "0.3", optional = true }
headers = { version = "0.4", optional = true }
http = { version = "1", optional = true }
lazy_static = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_html_form = { version = "0.2", optional = true }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", default-features = false, features = [
    "signal",
    "rt-multi-thread",
], optional = true }
tracing = { version = "0.1", features = ["attributes"], optional = true }
uuid = { version = "1", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }

[dev-dependencies]
tracing-subscriber = "0.3"
