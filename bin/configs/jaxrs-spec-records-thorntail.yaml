generatorName: jaxrs-spec
outputDir: samples/server/petstore/jaxrs-spec-records-thorntail
library: thorntail
inputSpec: modules/openapi-generator/src/test/resources/3_0/jaxrs-spec/oneof_interface.yaml
templateDir: modules/openapi-generator/src/main/resources/JavaJaxRS/spec
additionalProperties:
  artifactId: jaxrs-spec-records-thorntail-petstore-server
  useOneOfInterfaces: "true"
  useSealed: "true"
  useRecords: "true"
  hideGenerationTimestamp: "true"
  # This library's pom does not ship jackson-databind-nullable, and the pojo
  # template imports JsonNullable whenever openApiNullable is on (the default),
  # so the sample would not compile. Unrelated to records; see PetBase.
  openApiNullable: "false"
