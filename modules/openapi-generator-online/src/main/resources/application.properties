springfox.documentation.swagger.v2.path=/api-docs
server.port=8080
spring.jackson.date-format=org.openapitools.codegen.online.RFC3339DateFormat
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
# TODO: remove this line (back to the default PathPatternParser) once springfox is replaced by springdoc.
# springfox 3.0.0 only works with the Ant-style path matcher, which is no longer the default since Spring Boot 2.6;
# without this line the application fails to start.
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
