openapi: 3.2.0
info:
  title: query operation test
  version: '1.0'
paths:
  /pets:
    query:
      operationId: queryPets
      parameters:
        - name: qs
          in: querystring
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: string
      responses:
        '200':
          description: ok
    additionalOperations:
      PURGE:
        operationId: purgePets
        responses:
          '204':
            description: done
