openapi: 3.2.0
info:
  title: querystring with path parameter
  version: '1.0'
paths:
  /pets/{petId}:
    get:
      operationId: getPetByQuery
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
        - name: qs
          in: querystring
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: string
      responses:
        '200':
          description: ok
