openapi: 3.2.0
info:
  title: method doc escape test
  version: '1.0'
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: ok
    additionalOperations:
      # all four are valid RFC 9110 tchar but have special meaning in the
      # markdown tables/code spans emitted by the rust doc templates
      "A|B":
        operationId: pipePets
        responses:
          '204':
            description: done
      "A*B":
        operationId: starPets
        responses:
          '204':
            description: done
      "A_B":
        operationId: underscorePets
        responses:
          '204':
            description: done
      "A`B":
        operationId: backtickPets
        responses:
          '204':
            description: done
