openapi: 3.0.0
info:
  title: sttp4 model named Request
  version: 1.0.0
paths:
  /predict:
    post:
      operationId: predict
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
components:
  schemas:
    Request:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
    Response:
      type: object
      properties:
        score:
          type: number
