openapi: 3.0.3
info:
  title: issue 23705 x-items-extra-annotation
  version: 1.0.0
components:
  schemas:
    Stubb:
      type: object
      properties:
        name:
          type: string
    SampleModel:
      type: object
      properties:
        listStringNullable:
          type: array
          items:
            type: string
            nullable: true
            x-field-extra-annotation: '@Size(max=50)'
        listString:
          type: array
          items:
            x-field-extra-annotation:
              - '@NotNull'
              - '@Size(max=50)'
            type: string
            required: true
        listInteger:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        listSample:
          type: array
          items:
            $ref: '#/components/schemas/Stubb'
