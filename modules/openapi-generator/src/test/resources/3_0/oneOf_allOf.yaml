openapi: 3.0.3
info:
  title: oneOf_allOf
  version: 1.0.0
paths:
  /myExample:
    get:
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shape'
components:
  schemas:
    Shape:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [circle, rectangle]
      discriminator:
        propertyName: type
        mapping:
          circle: '#/components/schemas/Circle'
          rectangle: '#/components/schemas/Rectangle'
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Rectangle'

    Circle:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          required: [type, radius]
          properties:
            type: { type: string, enum: [circle] }
            radius: { type: integer, minimum: 1 }
    Rectangle:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          required: [ type, radius ]
          properties:
            type: { type: string, enum: [ rectangle ] }
            sideA: { type: integer, minimum: 1 }
            sideB: { type: integer, minimum: 1 }
