openapi: 3.0.1
info:
  title: oneOf test
  version: '1.0.0'
servers:
  - url: 'http://localhost:8000/'
paths:
  /state:
    get:
      operationId: getState
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ObjA'
                  - $ref: '#/components/schemas/ObjB'
                  - $ref: '#/components/schemas/ObjD'
                discriminator:
                  propertyName: realtype
                  mapping:
                    a-type: '#/components/schemas/ObjA'
                    b-type: '#/components/schemas/ObjB'
                    d-type: '#/components/schemas/ObjD'
    post:
      operationId: createState
      requestBody:
        content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ObjA'
                  - $ref: '#/components/schemas/ObjB'
                discriminator:
                  propertyName: realtype
                  mapping:
                    a-type: '#/components/schemas/ObjA'
                    b-type: '#/components/schemas/ObjB'
        required: true
      responses:
        '201':
          description: OK
components:
  schemas:
    CustomOneOfSchema:
      oneOf:
        - $ref: '#/components/schemas/ObjA'
        - $ref: '#/components/schemas/ObjB'
      discriminator:
        propertyName: realtype
        mapping:
          a-type: '#/components/schemas/ObjA'
          b-type: '#/components/schemas/ObjB'
    CustomOneOfArraySchema:
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/ObjA'
          - $ref: '#/components/schemas/ObjB'
          - $ref: '#/components/schemas/ObjC'
        discriminator:
          propertyName: realtype
          mapping:
            a-type: '#/components/schemas/ObjA'
            b-type: '#/components/schemas/ObjB'
            c-type: '#/components/schemas/ObjC'
    ObjA:
      type: object
      properties:
        realtype:
          type: string
        message:
          type: string
    ObjB:
      type: object
      properties:
        realtype:
          type: string
        description:
          type: string
        code:
          type: integer
          format: int32
    ObjC:
      type: object
      properties:
        realtype:
          type: string
        state:
          type: string
    ObjD:
      type: object
      properties:
        realtype:
          type: string
        color:
          type: string
    # each variant pins the tag with an enum, inline or $ref: serialized once, deserialized with the tag kept
    RenderRequest:
      oneOf:
        - $ref: '#/components/schemas/VerifyEmailRender'
        - $ref: '#/components/schemas/ResetPasswordRender'
      discriminator:
        propertyName: templateId
        mapping:
          verify-email: '#/components/schemas/VerifyEmailRender'
          reset-password: '#/components/schemas/ResetPasswordRender'
    VerifyEmailRender:
      type: object
      required:
        - templateId
        - name
      properties:
        templateId:
          type: string
          enum: [verify-email]
        name:
          type: string
    ResetPasswordRender:
      type: object
      required:
        - templateId
        - url
      properties:
        templateId:
          type: string
          enum: [reset-password]
        url:
          type: string
    ShapeKind:
      type: string
      enum: [circle, square]
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
          square: '#/components/schemas/Square'
    Circle:
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/ShapeKind'
        radius:
          type: number
    Square:
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/ShapeKind'
        side:
          type: number
    # the tag is an optional inline enum: the union writes it when the variant leaves it unset
    Note:
      oneOf:
        - $ref: '#/components/schemas/TextNote'
        - $ref: '#/components/schemas/LinkNote'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextNote'
          link: '#/components/schemas/LinkNote'
    TextNote:
      type: object
      properties:
        kind:
          type: string
          enum: [text]
        body:
          type: string
    LinkNote:
      type: object
      properties:
        kind:
          type: string
          enum: [link]
        href:
          type: string
