openapi: "3.0.4"
info:
  title: "test"
  version: "0.0.1"
paths:
  "/":
    post:
      operationId: foo
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/Pet"
      responses:
        "200":
          description: Re-serialize and echo the request data
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Shape"
components:
  schemas:
    PetKind:
      type: string
      enum:
        - dog
        - cat
    # Discriminator property is a $ref to an enum, every mapping value is an enum value
    Pet:
      discriminator:
        propertyName: kind
        mapping:
          dog: "#/components/schemas/Dog"
          cat: "#/components/schemas/Cat"
      oneOf:
        - "$ref": "#/components/schemas/Dog"
        - "$ref": "#/components/schemas/Cat"
    Dog:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/PetKind"
        bark:
          type: string
      required:
        - kind
    Cat:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/PetKind"
        meow:
          type: string
      required:
        - kind
    ShapeKind:
      type: string
      enum:
        - circle
    # Discriminator value of Square is not an enum value -> untagged
    Shape:
      discriminator:
        propertyName: kind
      oneOf:
        - "$ref": "#/components/schemas/Circle"
        - "$ref": "#/components/schemas/Square"
    Circle:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/ShapeKind"
      required:
        - kind
    Square:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/ShapeKind"
      required:
        - kind
    RodentKind:
      type: string
      enum:
        - hamster
        - mouse
    # Discriminator property of Mouse is optional -> untagged
    Rodent:
      discriminator:
        propertyName: kind
        mapping:
          hamster: "#/components/schemas/Hamster"
          mouse: "#/components/schemas/Mouse"
      oneOf:
        - "$ref": "#/components/schemas/Hamster"
        - "$ref": "#/components/schemas/Mouse"
    Hamster:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/RodentKind"
      required:
        - kind
    Mouse:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/RodentKind"
    # Several discriminator values map to the same variant, discriminator property is a $ref to an enum
    # (from 3_0/oneOf_reuseRef.yaml)
    FruitType:
      type: string
      enum:
        - green_apple
        - red_apple
        - banana
    Fruit:
      oneOf:
        - $ref: '#/components/schemas/Apple'
        - $ref: '#/components/schemas/Banana'
      discriminator:
        propertyName: fruitType
        mapping:
          green_apple: '#/components/schemas/Apple'
          banana: '#/components/schemas/Banana'
          red_apple: '#/components/schemas/Apple'
    Apple:
      type: object
      properties:
        fruitType:
          $ref: '#/components/schemas/FruitType'
        cultivar:
          type: string
      required:
        - fruitType
    Banana:
      type: object
      properties:
        fruitType:
          $ref: '#/components/schemas/FruitType'
        lengthCm:
          type: number
      required:
        - fruitType
    # Several discriminator values map to the same variant, discriminator property is not defined in the variants
    # (from 3_0/rust/test_duplicates.yaml)
    PersonOrVehicle:
      anyOf:
        - $ref: '#/components/schemas/Person'
        - $ref: '#/components/schemas/Vehicle'
      discriminator:
        propertyName: objectType
        mapping:
          student: '#/components/schemas/Person'
          teacher: '#/components/schemas/Person'
          car: '#/components/schemas/Vehicle'
    Person:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
      required:
        - type
        - name
    Vehicle:
      type: object
      properties:
        type:
          type: string
        speed:
          type: number
      required:
        - type
        - speed
