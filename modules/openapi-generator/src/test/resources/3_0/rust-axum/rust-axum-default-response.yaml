openapi: "3.0.4"
info:
  title: "test"
  version: "0.0.1"
paths:
  "/pets":
    get:
      operationId: listPets
      responses:
        "200":
          description: A list of pets
          headers:
            X-Rate-Limit:
              schema:
                type: integer
          content:
            "application/json":
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Pet"
        default:
          description: Unexpected error
          headers:
            X-Rate-Limit:
              schema:
                type: integer
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/pets/{petId}":
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The pet
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pet deleted
        default:
          description: Unexpected error
  "/pets/{petId}/adopt":
    post:
      operationId: adoptPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pet adopted
        default:
          description: Unexpected error
          headers:
            X-Request-Id:
              schema:
                type: string
  "/events":
    get:
      operationId: streamEvents
      responses:
        default:
          description: Event stream
          content:
            "text/event-stream":
              schema:
                type: string
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
