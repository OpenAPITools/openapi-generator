openapi: "3.0.4"
info:
  title: "test"
  version: "0.0.1"
paths:
  "/":
    post:
      operationId: foo
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/Message"
      responses:
        "200":
          description: Re-serialize and echo the request data
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Message"
  "/issue21143_1":
    post:
      operationId: i21143_1
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: array
              items:
                type: integer
      responses:
        "200":
          description: Re-serialize and echo the request data
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Message"
  "/issue21143_2":
    post:
      operationId: i21143_2
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: string
      responses:
        "200":
          description: Re-serialize and echo the request data
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Message"
  "/issue21143_3":
    post:
      operationId: i21143_3
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: integer
      responses:
        "200":
          description: Re-serialize and echo the request data
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Message"
components:
  schemas:
    Message:
      type: object
      additionalProperties: false
      discriminator:
        propertyName: op
        mapping:
          yo: "#/components/schemas/YoMessage"
      oneOf:
        - "$ref": "#/components/schemas/Hello"
        - "$ref": "#/components/schemas/Greeting"
        - "$ref": "#/components/schemas/Goodbye"
        - "$ref": "#/components/schemas/SomethingCompletelyDifferent"
        - "$ref": "#/components/schemas/YoMessage"
      title: Message
    Hello:
      type: object
      additionalProperties: false
      title: Hello
      properties:
        op:
          type: string
          enum:
            - Hello
          default: Hello
        d:
          type: object
          properties:
            welcome_message:
              type: string
          required:
            - welcome_message
      required:
        - op
        - d
    Greeting:
      type: object
      additionalProperties: false
      title: Greeting
      properties:
        d:
          type: object
          properties:
            greet_message:
              type: string
          required:
            - greet_message
      required:
        - d
    Goodbye:
      type: object
      additionalProperties: false
      title: Goodbye
      properties:
        op:
          type: string
          enum:
            - Goodbye
        d:
          type: object
          properties:
            goodbye_message:
              type: string
          required:
            - goodbye_message
      required:
        - op
        - d
    SomethingCompletelyDifferent:
      oneOf:
        - items:
            type: object
          type: array
        - type: object
    YoMessage:
      type: object
      title: Yo
      properties:
        d:
          type: object
          properties:
            nickname:
              type: string
          required:
            - nickname
      required:
        - op
        - d
    PetKind:
      type: string
      enum:
        - dog
        - cat
    # Discriminator property is a $ref to an enum, every mapping value is an enum value
    Pet:
      discriminator:
        propertyName: kind
        mapping:
          dog: "#/components/schemas/Dog"
          cat: "#/components/schemas/Cat"
      oneOf:
        - "$ref": "#/components/schemas/Dog"
        - "$ref": "#/components/schemas/Cat"
    Dog:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/PetKind"
        bark:
          type: string
      required:
        - kind
    Cat:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/PetKind"
        meow:
          type: string
      required:
        - kind
    ShapeKind:
      type: string
      enum:
        - circle
    # Discriminator value of Square is not an enum value -> untagged
    Shape:
      discriminator:
        propertyName: kind
      oneOf:
        - "$ref": "#/components/schemas/Circle"
        - "$ref": "#/components/schemas/Square"
    Circle:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/ShapeKind"
      required:
        - kind
    Square:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/ShapeKind"
      required:
        - kind
    RodentKind:
      type: string
      enum:
        - hamster
        - mouse
    # Discriminator property of Mouse is optional -> untagged
    Rodent:
      discriminator:
        propertyName: kind
        mapping:
          hamster: "#/components/schemas/Hamster"
          mouse: "#/components/schemas/Mouse"
      oneOf:
        - "$ref": "#/components/schemas/Hamster"
        - "$ref": "#/components/schemas/Mouse"
    Hamster:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/RodentKind"
      required:
        - kind
    Mouse:
      type: object
      properties:
        kind:
          "$ref": "#/components/schemas/RodentKind"
