openapi: 3.0.3
info:
  title: Rust Axum Range Response Codes Test
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "4XX":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Server error
          headers:
            Retry-After:
              schema:
                type: integer
                format: int32
    delete:
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Deleted
        "4XX":
          description: Client error
        "5XX":
          description: Server error
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/events:
    get:
      operationId: getPetEvents
      responses:
        "2XX":
          description: Pet events
          headers:
            X-Stream-Id:
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  data:
                    type: string
        "5XX":
          description: Server error
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
