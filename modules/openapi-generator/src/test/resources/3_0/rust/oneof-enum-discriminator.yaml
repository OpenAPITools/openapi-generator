openapi: 3.0.3
info:
  title: oneOf with enum discriminators
  version: 1.0.0
paths:
  /render:
    post:
      operationId: render
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shape'
components:
  schemas:
    # the tag is an inline single-value enum in every variant
    RenderRequest:
      oneOf:
        - $ref: '#/components/schemas/VerifyEmailRender'
        - $ref: '#/components/schemas/ResetPasswordRender'
      discriminator:
        propertyName: templateId
        mapping:
          verify-email: '#/components/schemas/VerifyEmailRender'
          reset-password: '#/components/schemas/ResetPasswordRender'
    VerifyEmailRender:
      type: object
      required:
        - templateId
        - name
      properties:
        templateId:
          type: string
          enum: [verify-email]
        name:
          type: string
    ResetPasswordRender:
      type: object
      required:
        - templateId
        - url
      properties:
        templateId:
          type: string
          enum: [reset-password]
        url:
          type: string
    # the tag is a $ref to an enum shared by the variants
    ShapeKind:
      type: string
      enum: [circle, square]
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
          square: '#/components/schemas/Square'
    Circle:
      type: object
      required:
        - kind
        - radius
      properties:
        kind:
          $ref: '#/components/schemas/ShapeKind'
        radius:
          type: number
    Square:
      type: object
      required:
        - kind
        - side
      properties:
        kind:
          $ref: '#/components/schemas/ShapeKind'
        side:
          type: number
    # the tag is an optional inline enum: the union writes it when the variant leaves it unset
    Note:
      oneOf:
        - $ref: '#/components/schemas/TextNote'
        - $ref: '#/components/schemas/LinkNote'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextNote'
          link: '#/components/schemas/LinkNote'
    TextNote:
      type: object
      properties:
        kind:
          type: string
          enum: [text]
        body:
          type: string
    LinkNote:
      type: object
      properties:
        kind:
          type: string
          enum: [link]
        href:
          type: string
    # a plain string tag keeps the serde tag
    Event:
      oneOf:
        - $ref: '#/components/schemas/Click'
        - $ref: '#/components/schemas/Scroll'
      discriminator:
        propertyName: type
        mapping:
          click: '#/components/schemas/Click'
          scroll: '#/components/schemas/Scroll'
    Click:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        x:
          type: integer
    Scroll:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        dy:
          type: integer
