openapi: 3.0.3
info:
  title: discriminated union
  version: 1.0.0
paths:
  /errors:
    get:
      operationId: getError
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
        message:
          type: string
      discriminator:
        propertyName: type
        mapping:
          ObjectExists: '#/components/schemas/ObjectExists'
          ValidationError: '#/components/schemas/ValidationError'
    ObjectExists:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required:
            - identifier
          properties:
            identifier:
              type: string
            objectType:
              type: string
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            field:
              type: string
    # nullable and enum-typed discriminators: String::is_empty would not compile against either
    NullableTagged:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          nullable: true
        label:
          type: string
      discriminator:
        propertyName: kind
        mapping:
          Alpha: '#/components/schemas/Alpha'
    Alpha:
      allOf:
        - $ref: '#/components/schemas/NullableTagged'
        - type: object
          properties:
            alphaOnly:
              type: string
    Pet:
      type: object
      required:
        - petType
      properties:
        petType:
          type: string
          enum: [Cat, Dog]
      discriminator:
        propertyName: petType
        mapping:
          Cat: '#/components/schemas/Cat'
          Dog: '#/components/schemas/Dog'
    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            lives:
              type: integer
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            bark:
              type: boolean
    ShapeKind:
      type: string
      enum: [circle]
    Shape:
      type: object
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/ShapeKind'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
    Circle:
      allOf:
        - $ref: '#/components/schemas/Shape'
        - type: object
          properties:
            radius:
              type: number
    # the mapping names the base itself: no struct to wrap, so the union keeps the inline variants
    Creature:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
        name:
          type: string
      discriminator:
        propertyName: kind
        mapping:
          Creature: '#/components/schemas/Creature'
          Bird: '#/components/schemas/Bird'
    Bird:
      allOf:
        - $ref: '#/components/schemas/Creature'
        - type: object
          properties:
            wingspan:
              type: number
