openapi: 3.0.0
info:
  description: test fully qualified name and jspecify
  title: jspecify
  version: 1.0.0
tags:
  - name: requiredAndNullable
    description: requiredAndNullable
  - name: foo
    description: foo
  - name: upload
    description: upload
  - name: file
    description: file
paths:
  /foo/{dtParam}:
    get:
      tags:
        - foo
      parameters:
        - in: path
          name: dtParam
          # the Spring generator accepts nullable path param!
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: dtQuery
          schema:
            type: string
            format: date-time
        - in: cookie
          name: dtCookie
          schema:
            type: string
            format: date-time
        - in: query
          name: color
          schema:
            type: string
            default: red
      responses:
        default:
          description: response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Foo'
  /requiredAndNullable:
    post:
      tags:
        - requiredAndNullable
      requestBody:
        required: true
        description: bodyWithRequiredAndNullableAttributes
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequiredAndNullable'
      responses:
        default:
          description: response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequiredAndNullable'
  /upload:
    post:
      tags:
        - upload
      requestBody:
        description: file
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        default:
          description: ok
  /uploadFiles:
    post:
      tags:
        - upload
      requestBody:
        description: file
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        default:
          description: ok
  /file/{id}:
    get:
      tags:
        - file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
components:
  schemas:
    Foo:
      required:
        - requiredDt
        - requiredColor
      properties:
        dt:
          type: string
          format: date-time
        nullableDt:
          nullable: true
          type: string
          format: date-time
        binary:
          type: string
          format: binary
        nullableBinary:
          type: string
          format: binary
          nullable: true
        listOfDt:
          type: array
          items:
            type: string
            format: date-time
        listMinIntems:
          type: array
          minItems: 1
          items:
            type: string
            format: date-time
        nullableListMinIntems:
          type: array
          minItems: 1
          nullable: true
          items:
            type: string
            format: date-time
        requiredDt:
          type: string
          format: date-time
        number:
          type: number
        nullableNumber:
          type: number
          nullable: true
        color:
          type: string
          default: red
        requiredColor:
          default: red
          type: string
        nullableColor:
          type: string
          default: red
          nullable: true
    RequiredAndNullable:
      type: object
      required:
        - str
        - file
        - color
        - onlyRequired
        - list
      properties:
        str:
          nullable: true
          type: string
        file:
          nullable: true
          type: string
          format: binary
        color:
          type: string
          default: red
          nullable: true
        onlyRequired:
          # NON nullable
          type: string
        list:
          type: array
          nullable: true
          items:
            type: string
    FileContent:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        virusScan:
          type: string
          readOnly: true
          enum:
            - clean
            - detected
