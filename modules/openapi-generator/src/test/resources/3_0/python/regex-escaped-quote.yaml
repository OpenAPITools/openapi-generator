openapi: 3.0.3
info:
  title: Python regex escaped quote
  version: 1.0.0
paths:
  /example:
    get:
      operationId: getExample
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatternModel'
components:
  schemas:
    PatternModel:
      type: object
      properties:
        name:
          type: string
          pattern: '[^\/:?*<>\"|]*'
