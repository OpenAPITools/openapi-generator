openapi: 3.0.3
info:
  title: Pet Service Mixed Array Content Negotiation
  version: 1.0.0
paths:
  /pets/summary:
    get:
      operationId: getPetSummaries
      tags:
        - pets
      responses:
        '200':
          description: pet summaries, content negotiated via the Accept header
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PetSummary'
            application/xml:
              schema:
                $ref: '#/components/schemas/PetSummary'
components:
  schemas:
    PetSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
