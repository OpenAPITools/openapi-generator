      operationId: arrayAlias
      parameters:
        - name: q
          in: query
          schema:
            $ref: '#/components/schemas/ArrAliasJ'
      responses:
        '200':
          description: ok
  /control:
    post:
      operationId: control
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasCtl'
      responses:
        '200':
          description: ok
