          in: query
          schema:
            $ref: '#/components/schemas/ParamModel'
      responses:
        '200':
          description: ok
  /ap:
    get:
      operationId: ap
      parameters:
        - name: q
          in: query
          schema:
            $ref: '#/components/schemas/ApHolder'
      responses:
        '200':
          description: ok
  /arrayalias:
