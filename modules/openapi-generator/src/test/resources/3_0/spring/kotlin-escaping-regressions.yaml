openapi: 3.0.3
info:
  title: 'Kotlin $ & " \ title'
  description: 'Description $ & " \ details'
  termsOfService: 'https://example.test/$terms?value=one&two'
  contact:
    name: 'Contact $ & " \ name'
    url: 'https://example.test/$contact'
    email: 'contact$@example.test'
  license:
    name: 'License $ & " \ name'
    url: 'https://example.test/$license'
  version: '1.0.$version'
servers:
  - url: /server-$context
security:
  - 'oauth$"name':
      - 'scope$"name'
paths:
  /escaping/operations-$path:
    get:
      tags:
        - escaping
      operationId: escaped
      responses:
        '204':
          description: No content
  '/kdoc-\u002a/':
    get:
      tags:
        - escaping
      operationId: escapedKdoc
      responses:
        '204':
          description: No content
  /discriminator:
    get:
      tags:
        - escaping
      operationId: getDiscriminator
      responses:
        '200':
          description: Discriminator response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscriminatorParent'
components:
  securitySchemes:
    'oauth$"name':
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.test/token
          scopes:
            'scope$"name': 'Scope description $ " \u002a/'
  schemas:
    UriDefault:
      type: object
      properties:
        value:
          type: string
          format: uri
          default: 'https://example.test/$uri'
    DiscriminatorParent:
      oneOf:
        - $ref: '#/components/schemas/DiscriminatorChild'
        - $ref: '#/components/schemas/OtherDiscriminatorChild'
      discriminator:
        propertyName: '$kind'
        mapping:
          'kind$"\name': '#/components/schemas/DiscriminatorChild'
          'mapping$"\name': '#/components/schemas/OtherDiscriminatorChild'
    DiscriminatorChild:
      type: object
      properties:
        '$kind':
          type: string
        payload:
          type: string
    OtherDiscriminatorChild:
      type: object
      properties:
        '$kind':
          type: string
