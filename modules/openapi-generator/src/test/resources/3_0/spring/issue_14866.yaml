openapi: 3.0.3
info:
  title: URL encoded form arrays
  version: 1.0.0
paths:
  /issue:
    post:
      operationId: reproduceIssue
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - requiredStrings
              properties:
                listOfStrings:
                  type: array
                  items:
                    type: string
                requiredStrings:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: successful operation
