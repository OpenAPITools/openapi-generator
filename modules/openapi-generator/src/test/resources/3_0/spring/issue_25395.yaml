openapi: 3.0.3
info:
  title: Test Issue #25395
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Tag:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
    NicknamedPet:
      type: object
      required:
        - id
        - nickname
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
          nullable: true
    Animal:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
      discriminator:
        propertyName: kind
    Dog:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          required:
            - breed
          properties:
            breed:
              type: string
    Base:
      type: object
      properties:
        kind:
          type: string
      discriminator:
        propertyName: kind
    Hound:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required:
            - scent
          properties:
            scent:
              type: string
    Bag:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      additionalProperties:
        type: string
