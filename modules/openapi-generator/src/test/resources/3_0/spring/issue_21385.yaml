openapi: 3.0.3
info:
  title: Pet Service
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful pet lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetDetailsResponse'
        '404':
          description: pet not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    PetDetailsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
