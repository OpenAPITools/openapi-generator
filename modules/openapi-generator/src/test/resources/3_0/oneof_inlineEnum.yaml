openapi: 3.0.1
info:
  title: ByRefOrValue
  description: >
    This tests for a oneOf interface representation
  version: 0.0.1
servers:
  - url: "http://localhost:8080"
paths:
  /foo:
    get:
      summary: GET all Foos
      operationId: getAllFoos
      responses:
        '200':
          content:
            application/json:
              schema:
              $ref: '#/components/schemas/Fruit'



components:
  schemas:
    Fruit:
      type: object
      properties:
        fruitType:
          type: string
          enum: [ APPLE, BANANA ]
      required:
        - fruitType
      oneOf:
        - $ref: '#/components/schemas/Apple'
        - $ref: '#/components/schemas/Banana'
      discriminator:
        propertyName: fruitType
        mapping:
          APPLE: '#/components/schemas/Apple'
          BANANA: '#/components/schemas/Banana'
    Apple:
      type: object
      required:
        - seeds
      properties:
        seeds:
          type: integer
    Banana:
      type: object
      required:
        - length
      properties:
        length:
          type: integer
