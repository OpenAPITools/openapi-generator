openapi: 3.1.0
info:
  title: discriminator_constants
  version: '1.0.0'
components:
  schemas:
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: type
        mapping:
          CAT: '#/components/schemas/Cat'
          DOG: '#/components/schemas/Dog'
    Cat:
      description: A representation of a cat
      type: object
      properties:
        type:
          type: string
          const: CAT
        huntingSkill:
          type: string
      required:
        - type
        - huntingSkill
    Dog:
      description: A representation of a dog
      type: object
      properties:
        type:
          type: string
          const: DOG
        packSize:
          type: integer
          format: int32
      required:
        - type
        - packSize
    PetInteger:
      oneOf:
        - $ref: '#/components/schemas/CatInteger'
        - $ref: '#/components/schemas/DogInteger'
      discriminator:
        propertyName: intType
        mapping:
          1: '#/components/schemas/CatInteger'
          2: '#/components/schemas/DogInteger'
    CatInteger:
      description: A representation of a cat
      type: object
      properties:
        intType:
          type: integer
        huntingSkill:
          type: string
      required:
        - intType
        - huntingSkill
    DogInteger:
      description: A representation of a dog
      type: object
      properties:
        intType:
          type: integer
        packSize:
          type: integer
          format: int32
      required:
        - intType
        - packSize
    PetEnumRef:
      oneOf:
        - $ref: '#/components/schemas/CatEnumRef'
        - $ref: '#/components/schemas/DogEnumRef'
      discriminator:
        propertyName: enumRefType
        mapping:
          CAT: '#/components/schemas/CatEnumRef'
          DOG: '#/components/schemas/DogEnumRef'
    CatEnumRef:
      description: A representation of a cat
      type: object
      properties:
        enumRefType:
          $ref: '#/components/schemas/PetEnumType'
        huntingSkill:
          type: string
      required:
        - enumRefType
        - huntingSkill
    DogEnumRef:
      description: A representation of a dog
      type: object
      properties:
        enumRefType:
          $ref: '#/components/schemas/PetEnumType'
        packSize:
          type: integer
          format: int32
      required:
        - enumRefType
        - packSize
    PetEnumType:
      type: string
      enum:
        - CAT
        - DOG