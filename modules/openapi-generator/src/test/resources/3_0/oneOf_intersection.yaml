C
info:
  title: CENTRALIS PARTY FED API
  version: 1.0.5
  description: |
    Core Centralis Party Service
  contact:
    name: Fednot
    email: centaurus@fednot.be
    url: https://www.fednot.be
  license:
    name: unlicensed
    url: https://www.fednot.be
servers:
  - url: http://localhost:8080/centralis-party/v1/api

tags:
  - name: Party
    description: Retrieve party information
  - name: PartySearch
    description: Search for parties with the authentic sources
  - name: CodeList
    description: Get transactions of the codes used in some party fiels.
  - name: Formality
    description: Party Formalities
  - name: Info
    description: get code lists, service info...
paths:
  /info:
    get:
      operationId: get-info
      summary: Get info about the formalities and codelists in this service
      description: Gets info
      tags:
        - Info
      parameters:
        # Headers
        - $ref: '#/components/parameters/Header.AcceptLanguage'
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'
      responses:
        '200':
          $ref: '#/components/responses/ServiceInfoResponse'
        default:
          $ref: '#/components/responses/Error'
  /party-searches:
    post:
      operationId: create-party-search
      summary: Search for parties
      description: |
        Search for parties within the authentic source.
      tags:
        - PartySearch

      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.AcceptLanguage'
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'

      requestBody:
        $ref: '#/components/requestBodies/CreatePartySearchRequest'

      responses:
        '201':
          $ref: '#/components/responses/PartySearch'
        default:
          $ref: '#/components/responses/Error'
  /parties:
    get:
      operationId: get-parties
      summary: List parties
      description: |
        List parties
      tags:
        - Party
      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.AcceptLanguage'
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'


          # Pagination
        - $ref: "#/components/parameters/Query.Offset"
        - $ref: "#/components/parameters/Query.Limit"

          # Filters
        - $ref: "#/components/parameters/Query.IdsFilter"
        - $ref: "#/components/parameters/Query.ObjectFilter"


      responses:
        '200':
          $ref: '#/components/responses/PartyCollection'
        default:
          $ref: '#/components/responses/Error'
  /parties/{id}:
    get:
      operationId: get-party
      summary: Get a Party
      description: |
        Get a party by its identifier
      tags:
        - Party
      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.AcceptLanguage'
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'

          # Path Parameters
        - $ref: '#/components/parameters/Path.Id'

      responses:
        '200':
          $ref: '#/components/responses/Party'
        default:
          $ref: '#/components/responses/Error'
  /parties/check-existence:
    post:
      operationId: check-party-existence
      summary: Checks that the parties with the specified identifiers exist
      description: |
        Checks that parties with the defined identifiers exist
      tags:
        - Party
      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'
      requestBody:
        $ref: '#/components/requestBodies/CheckPartyExistenceRequest'
      responses:
        '200':
          $ref: '#/components/responses/CheckPartyExistence'
        default:
          $ref: '#/components/responses/Error'
  /parties/nrn:
    post:
      operationId: get-party-id-nrn-tuples
      summary: Retrieves the Nrn's linked to party ids
      description: |
        Retrieves the Nrn's linked to party ids
      tags:
        - Party
      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'
      requestBody:
        $ref: '#/components/requestBodies/PartyNrnRequest'
      responses:
        '200':
          $ref: '#/components/responses/PartiesNrn'
        default:
          $ref: '#/components/responses/Error'
  /parties/uuid:
    post:
      operationId: get-party-uuid-personNumber
      summary: Retrieves the uuid linked to a person based their personNumber.
      description: |
        Retrieves the uuid linked to a person based their personNumber.
      tags:
        - Party
      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'
      requestBody:
        $ref: '#/components/requestBodies/PartyUuidRequest'
      responses:
        '200':
          $ref: '#/components/responses/PartiesUuid'
        default:
          $ref: '#/components/responses/Error'
  /code-lists/{codeListType}:
    get:
      operationId: get-code-lists
      summary: Get code List translations
      description: |
        Use this endpoint to retrieve the translations of the codes used in parties.
      tags:
        - CodeList
      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.AcceptLanguage'
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'

          # Query Parameters for code-list filtering
        - $ref: "#/components/parameters/Path.CodeListType"
      responses:
        '200':
          $ref: '#/components/responses/CodeList'
        default:
          $ref: '#/components/responses/Error'

  # Party Formalities
  /formalities:
    get:
      operationId: get-formalities
      summary: Get formalities known by the Party Service
      description: Get a list of formalities known by the Party Service
      tags:
        - Formality


      parameters:
        # Pagination
        - $ref: '#/components/parameters/Query.Limit'
        - $ref: '#/components/parameters/Query.Offset'

      # Todo: add filters

      responses:
        '200':
          $ref: '#/components/responses/FormalityCollection'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: create-formality
      summary: Create a formality
      description: |
        Creates a new formality
      tags:
        - Formality

      parameters:
        # Header Parameters
        - $ref: '#/components/parameters/Header.AcceptLanguage'
        - $ref: '#/components/parameters/Header.RequiredFormalityId'

      requestBody:
        $ref: '#/components/requestBodies/CreateFormalityRequest'

      responses:
        '201':
          $ref: '#/components/responses/Formality'
        default:
          $ref: '#/components/responses/Error'
  /formalities/{id}:
    get:
      operationId: get-formality
      summary: Get a formality by its unique Id
      description: Gets a formality by its universal unique identifier
      tags:
        - Formality

      parameters:
        # Header Parameters:
        - $ref: '#/components/parameters/Header.RequiredGlobalTransactionId'

          # Path Parameters:
        - $ref: '#/components/parameters/Path.Id'

      responses:
        '200':
          $ref: '#/components/responses/Formality'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: update-formality
      summary: Update a formality
      description: |
        Updates a formality
      tags:
        - Formality

      parameters:
        # Path Parameters:
        - $ref: '#/components/parameters/Path.Id'

      requestBody:
        $ref: '#/components/requestBodies/UpdateFormalityRequest'

      responses:
        '200':
          $ref: '#/components/responses/Formality'
        default:
          $ref: '#/components/responses/Error'

components:
  schemas:
    CodeListTypeEnum:
      title: CodeListTypeEnum
      description: |
        Code lists supported by Party Service.
      type: string
      enum:
        - legalPersonEnterpriseStatus
        - legalPersonJuridicalForm
        - naturalPersonCivilState
        - naturalPersonDescentType
        - naturalPersonLegalDisabilityJudicialStatus
        - naturalPersonLegalDisabilityJustification
        - naturalPersonLegalGuardianJudicialStatus
        - naturalPersonLegalGuardianJustification
    ServiceInfo:
      title: ServiceInfo
      description: |
        Each Centralis Compliant service should expose a GET /info endpoint returning this schema.
        This provides information to Centralis on the service, and what features it offers.
      type: object
      required:
        - codeLists
        - formalities
      properties:
        codeLists:
          description: |
            This array returns the list of codeLists that this service offers.
          type: array
          items:
            $ref: '#/components/schemas/CodeListType'
        formalities:
          description: |
            This array returns the formalities this service implements
          type: array
          items:
            $ref: '#/components/schemas/FormalityServiceInfo'
    Error:
      title: Error
      description: |
        All the errors are returned in the same standard format and contain at least the following fields. Additional fields could be included depending on the error.
        * __type__ 
          Identifies the error type.
        * __title__ 
          Title of this error.
        * __detail__ 
          Additional details/description of the error.
        * __instance__ 
          A unique identifier for this error.
        * __timestamp__ 
          The time at which this error occurred.
        * __status__
          The status code of the error.
        
        As specified the errors returned are always accompanied by an error type. This error type identifies the type of error in hierarchical fashion. As an example the following error type; '/error/client/technical/unauthorized' indicates that this error is a technical client error preventing the authorization of the request, e.g the client did not provide a username. The precise nature of the error can usually be found in the details field.
        A number of errors are generic errors that can be returned for each resource;
        * /error/client/technical/**malformed**
          * Request contains malformed JSON
        * /error/client/technical/**unauthorized**
          * Missing identity headers
        * /error/client/technical/**methodnotallowed**
          * Attempting to use a method that is not available for the specified resource
        * /error/client/technical/**unsupportedmedia**
          * The payload was provided in an unsupported format. (Content-Type not supported)
        * /error/client/technical/**ratelimit**
          * Too many requests per time unit.
        * /error/client/technical/**notfound**
          * The requested resource could not be found.
        * /error/client/technical/**largerequest**
          * The request exceeded the maximum request size.
        * /error/client/technical/**validation**
          * Missing fields, fields containing invalid values, etc
        * /error/server/**technical**
          * An unexpected error occurred.
        * /error/server/technical/**unavailable**
          * The service is temporarily unavailable.
      type: object
      required:
        - timestamp
        - title
        - type
        - detail
        - instance
        - status
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time at which the error occurred.
          readOnly: true
        title:
          type: string
          description: Short description of the error that occurred.
          readOnly: true
        type:
          type: string
          description: Provides a readable hierarchical description of the error type (akin to an error code).
        detail:
          type: string
          description: A more detailed description of the error that occurred.
          readOnly: true
        instance:
          type: string
          description: 'Unique identifier for this error, typically contains a transaction identifier.'
          readOnly: true
        status:
          type: integer
          format: int32
          description: References the HTTP status code associated with this error.
        errors:
          type: array
          description: Provides more detailed description of the errors that occurred. Useful when e.g more than one validation error was detected.
          items:
            $ref: '#/components/schemas/ErrorDetail'
          readOnly: true
    CodeListType:
      description: |
        Each code list supported within the scope of Centralis.
      type: string
    FormalityServiceInfo:
      title: FormalityServiceInfo
      description: |
        This object holds the configuration providing Centralis with information on how the formality works.
      type: object
      required:
        - type
        - subject
      properties:
        type:
          type: string
          description: |
            The object field of a formality indicates the type of formality being created.
            This will always match a value from the FormalityTypeEnum.
            In order to avoid breaking changes in consumer's codebases when introducing a new formality however,
            the enumeration is not being applied to this field.
            Consumers are strongly advised to implement a default fallback strategy when a type is being returned
            that has not been implemented on their end.
        subject:
          description: |
            Defines an array of allowed requirement lists.  
            As soon as the subject of a formality matches any of the items in this list, it will be accepted by Centralis.
          type: array
          items:
            $ref: '#/components/schemas/FormalitySubjectRequirementList'
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        resource:
          type: string
          description: Identifies the resource/location where the error occurred.
          readOnly: true
        field:
          type: string
          description: Identifies the specific field causing the error.
          readOnly: true
        detail:
          type: string
          description: Detailed description of the error.
          readOnly: true
        code:
          type: string
          description: |
            Indicates the type of problem detected with the specified field. Some possible values:
            * missing
            * invalid
          readOnly: true
    FormalitySubjectRequirementList:
      title: FormalitySubjectRequirementList
      description: |
        Defines a list of subject requirements that are allowed
      type: array
      items:
        $ref: '#/components/schemas/FormalitySubjectRequirement'
    FormalitySubjectRequirement:
      title: FormalitySubjectRequirement
      description: |
        Defines a requirement that needs to be met for the subject.
      type: object
      required:
        - type
      properties:
        type:
          type: 'string'
          enum:
            - Party
            - NaturalPerson
            - LegalPerson
            - Asset
            - RealEstate
        minimum:
          type: integer
          minimum: 0
        maximum:
          type: integer
          minimum: 0
      discriminator:
        propertyName: type
        mapping:
          Party: '#/components/schemas/FormalitySubjectRequirementParty'
          NaturalPerson: '#/components/schemas/FormalitySubjectRequirementNaturalPerson'
          LegalPerson: '#/components/schemas/FormalitySubjectRequirementLegalPerson'
          Asset: '#/components/schemas/FormalitySubjectRequirementAsset'
          RealEstate: '#/components/schemas/FormalitySubjectRequirementRealEstate'
    FormalitySubjectRequirementParty:
      title: FormalitySubjectRequirementParty
      description: |
        Defines a requirement that needs to be met for the subject of type Party.
      type: object
      required:
        - type
        - minimum
        - maximum
      allOf:
        - $ref: '#/components/schemas/FormalitySubjectRequirement'
    FormalitySubjectRequirementNaturalPerson:
      title: FormalitySubjectRequirementNaturalPerson
      description: |
        Defines a requirement that needs to be met for the subject of type Natural Person.
      type: object
      required:
        - type
        - minimum
        - maximum
      allOf:
        - $ref: '#/components/schemas/FormalitySubjectRequirement'
    FormalitySubjectRequirementLegalPerson:
      title: FormalitySubjectRequirementLegalPerson
      description: |
        Defines a requirement that needs to be met for the subject of type Legal Person.
      type: object
      required:
        - type
        - minimum
        - maximum
      allOf:
        - $ref: '#/components/schemas/FormalitySubjectRequirement'
    FormalitySubjectRequirementAsset:
      title: FormalitySubjectRequirementAsset
      description: |
        Defines a requirement that needs to be met for the subject of type Asset.
      type: object
      required:
        - type
        - minimum
        - maximum
      allOf:
        - $ref: '#/components/schemas/FormalitySubjectRequirement'
    FormalitySubjectRequirementRealEstate:
      title: FormalitySubjectRequirementRealEstate
      description: |
        Defines a requirement that needs to be met for the subject of type Real Estate.
      type: object
      required:
        - type
        - minimum
        - maximum
      allOf:
        - $ref: '#/components/schemas/FormalitySubjectRequirement'
        - type: object
          properties:
            allowedRegions:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/Region'
    Region:
      title: Region
      description: Identifies one of the three regions of Belgium.
      enum:
        - FlemishRegion
        - BrusselsCapitalRegion
        - WalloonRegion
    ModelIdentifier:
      title: Identifier for BaseModel
      description: Uniquely identifies each model
      type: string
      format: uuid
    PartySearch:
      title: PartySearch
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/PartySearchCreate'
        - type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Party'
    PartyCollection:
      title: PartyCollection
      allOf:
        - $ref: '#/components/schemas/BaseCollection'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Party'
    Party:
      title: Party
      type: object
      required:
        - object
      allOf:
        - $ref: '#/components/schemas/BaseModel'
      discriminator:
        propertyName: object
        mapping:
          naturalPerson: '#/components/schemas/NaturalPerson'
          legalPerson: '#/components/schemas/LegalPerson'

    PartyIdCollection:
      title: Party ID List
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: string
            format: uuid
    PartyIdNrnCollection:
      title: Party ID/Nrn tuple List
      description: contains a map of party UUIDs as key and corresponding NRN's as value
      type: object
      additionalProperties:
        type: string
    PartyNrnIdCollection:
      title: Party Nrn/Id tuple List
      description: contains a map of party numbers as key and corresponding UUIDs as value
      type: object
      additionalProperties:
        type: string
    CodeListValueCollection:
      title: CodeListValueCollection
      description: |
        list of code list values
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CodeListValue'
    FormalityCollection:
      title: FormalityCollection
      allOf:
        - $ref: '#/components/schemas/BaseCollection'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Formality'
    Formality:
      title: Formality
      type: object
      required:
        - object
      allOf:
        - $ref: '#/components/schemas/BaseFormality'
      #- oneOf:
      #    - $ref: './Implementations/PartyFiliationFormalityCreate.yaml'

      discriminator:
        propertyName: object
        mapping:
          PartyFiliationFormality: '#/components/schemas/PartyFiliationFormality'
          PartyLegalDisabilityFormality: '#/components/schemas/PartyLegalDisabilityFormality'
    PartySearchCreate:
      title: PartySearchCreate
      type: object
      required:
        - query
      properties:
        query:
          $ref: '#/components/schemas/PartySearchQuery'
    PartyNrn:
      title: Party Nrn List
      type: object
      required:
        - personNumber
      properties:
        personNumber:
          type: string
          pattern: "^[0-9]{11}$"
    FormalityCreate:
      title: FormalityCreate
      type: object
      required:
        - object
      allOf:
        - $ref: '#/components/schemas/BaseFormalityCreate'
      # - oneOf:
      # - $ref: './Implementations/PartyFiliationFormalityCreate.yaml'

      discriminator:
        propertyName: object
        mapping:
          PartyFiliationFormality: '#/components/schemas/PartyFiliationFormalityCreate'
          PartyLegalDisabilityFormality: '#/components/schemas/PartyLegalDisabilityFormalityCreate'
    FormalityUpdate:
      title: FormalityUpdate
      type: object
      required:
        - object
      allOf:
        - $ref: '#/components/schemas/BaseFormalityUpdate'
      discriminator:
        propertyName: object
        mapping:
          PartyFiliationFormality: '#/components/schemas/PartyFiliationFormalityUpdate'
          PartyLegalDisabilityFormality: '#/components/schemas/PartyLegalDisabilityFormalityUpdate'
    CodeListValue:
      title: CodeListValue
      description: |
        This object holds a code list value, mapping a code to its translated value.
      type: object
      required:
        - code
        - value
      properties:
        code:
          type: string
        value:
          type: string
        abbrevation:
          description: |
            When an abbreviation for the value is available, it will be exposed in this optional field.
          type: string




    BaseModel:
      title: BaseModel
      type: object
      required:
        - id
        - object
        - meta
      properties:
        id:
          $ref: '#/components/schemas/ModelIdentifier'
        object:
          $ref: '#/components/schemas/ObjectType'
        meta:
          $ref: '#/components/schemas/ModelMetaData'


    BaseCollection:
      title: BaseCollection
      type: object
      required:
        - pagination
      properties:
        pagination:
          $ref: '#/components/schemas/CollectionPagination'
    NaturalPerson:
      title: NaturalPerson
      type: object
      allOf:
        - $ref: '#/components/schemas/Party'
        - type: object
          properties:
            nrn:
              $ref: '#/components/schemas/BeNrnIdentificationNumber'
            lastNames:
              type: array
              minItems: 1
              items:
                type: string
            firstNames:
              type: array
              minItems: 0
              items:
                type: string
            birthDate:
              $ref: '#/components/schemas/PartialDate'
            birthPlace:
              type: object
              required:
                - country
              properties:
                country:
                  $ref: '#/components/schemas/CountryEnum'
                municipality:
                  $ref: '#/components/schemas/Municipality'
            state:
              $ref: '#/components/schemas/NaturalPersonStateEnum'
            address:
              $ref: '#/components/schemas/Address'
            deceaseDate:
              $ref: '#/components/schemas/PartialDate'
            deceasePlace:
              type: object
              required:
                - country
              properties:
                country:
                  $ref: '#/components/schemas/CountryEnum'
                municipality:
                  $ref: '#/components/schemas/Municipality'
            nationalities:
              type: array
              minItems: 0
              items:
                oneOf:
                  - $ref: '#/components/schemas/CountryEnum'
                  - $ref: '#/components/schemas/NaturalPersonUnknownNationalityEnum'
            civilState:
              description: Element of code list naturalPersonCivilState
              type: string
      # gender (gdpr sensitive - considered not needed)
      # remarks
      # source
    LegalPerson:
      title: LegalPerson
      type: object
      allOf:
        - $ref: '#/components/schemas/Party'
        - type: object
          description: BasicEnterprise current situation
          properties:
            cbeNumber:
              $ref: '#/components/schemas/BeCbenIdentificationNumber'
            name:
              type: string
              description: The official name (social denomination - name_type 001) of an enterprise. Language returned based on requested language nl -> nl,fr,de,en,xx fr -> fr,nl,de,en,xx de -> de,fr,nl,en,xx
            address:
              $ref: '#/components/schemas/StructuredAddress'
            enterpriseStatus:
              description: Element of codeList legalPersonEnterpriseStatus. Actif,Inactif,...
              type: string
            enterpriseType:
              description: The enterprise type defines the legal form under which the enterprise activity is exercised.
              type: string
              enum:
                - legalPerson
                - physicalPerson
            juridicalForm:
              description: Element of codeList legalPersonJuridicalForm. The juridical form of the company.
              type: string
    BaseFormality:
      title: BaseFormality
      type: object
      required:
        - state
      allOf:
        - $ref: '#/components/schemas/BaseModel'
        - $ref: '#/components/schemas/BaseFormalityCreate'
        - type: object
          properties:
            original:
              $ref: '#/components/schemas/ModelIdentifier'
            state:
              $ref: '#/components/schemas/FormalityStateEnum'
            messages:
              type: array
              items:
                $ref: '#/components/schemas/FormalityMessage'
    PartyFiliationFormality:
      title: PartyFiliationFormality
      type: object
      required:
        - object
        - result
      allOf:
        - $ref: '#/components/schemas/Formality'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/PartyFiliationFormalityResult'
    PartyLegalDisabilityFormality:
      title: PartyLegalDisabilityFormality
      type: object
      required:
        - object
        - result
      allOf:
        - $ref: '#/components/schemas/Formality'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/PartyLegalDisabilityFormalityResult'
    PartySearchQuery:
      title: PartySearchQuery
      type: object
      oneOf:
        - $ref: '#/components/schemas/PartySearchNaturalPersonByNrnCreate'
        - $ref: '#/components/schemas/PartySearchNaturalPersonByNameCreate'
        - $ref: '#/components/schemas/PartySearchNaturalPersonByAddressCreate'
        - $ref: '#/components/schemas/PartySearchLegalPersonByCbenCreate'
        - $ref: '#/components/schemas/PartySearchLegalPersonByNameAddressCreate'
    BaseFormalityCreate:
      title: BaseFormalityCreate
      type: object
      required:
        - object
        - subject
      properties:
        object:
          $ref: '#/components/schemas/FormalityObject'
        subject:
          $ref: '#/components/schemas/FormalitySubject'
        original:
          $ref: '#/components/schemas/ModelIdentifier'
    PartyFiliationFormalityCreate:
      title: PartyFiliationFormalityCreate
      type: object
      required:
        - object
      allOf:
        - $ref: '#/components/schemas/FormalityCreate'
      # - type: object
      #   properties:
      #     parameters:
      #       exampleParameter:
      #         type: string
    PartyLegalDisabilityFormalityCreate:
      title: PartyLegalDisabilityFormalityCreate
      type: object
      required:
        - object
      allOf:
        - $ref: '#/components/schemas/FormalityCreate'
    BaseFormalityUpdate:
      title: BaseFormalityUpdate
      type: object
      allOf:
        - $ref: '#/components/schemas/BaseFormalityStateUpdate'
        - $ref: '#/components/schemas/BaseFormalitySubjectUpdate'
    PartyFiliationFormalityUpdate:
      title: PartyFiliationFormalityUpdate
      type: object
      required:
        - object
        - parameters
      allOf:
        - $ref: '#/components/schemas/FormalityUpdate'
    PartyLegalDisabilityFormalityUpdate:
      title: PartyLegalDisabilityFormalityUpdate
      type: object
      required:
        - object
        - parameters
      allOf:
        - $ref: '#/components/schemas/FormalityUpdate'
    ObjectType:
      title: Identifies the type of the object
      description: Identifies the type of the object your are holding.
      type: string
    ModelMetaData:
      title: ModelMetaData
      type: object
      description: 'Metadata about any resource being retrieved from the server'
      required:
        - createdAt
      properties:
        createdAt:
          description: 'Date and time of when the resource was initially created.  Immutable during for the entire resource lifecycle'
          type: string
          format: date-time
          readOnly: true
        modifiedAt:
          description: 'Date and time of when the resource was last modified.'
          type: string
          format: date-time
          readOnly: true
    CollectionPagination:
      title: CollectionPagination
      type: object
      required:
        - offset
        - total
        - limit
        - count
      properties:
        offset:
          type: integer
          description: 'The offset applied for querying the resource.  Offset is zerobased.'
          default: 0
          example: 0
        total:
          type: integer
          description: 'The total number of results found in the database for the given query.  Combining this with both `offset` and `limit` allows you to determine whether data is being paged, and you need subsequent requests to retrieve all data.'
          example: 80
        limit:
          type: integer
          description: 'The limit (maximum number of records) applied when querying the data.  '
          default: 15
          example: 15
        count:
          type: integer
          description: 'The number of results returned in the response.  In the event that you are fetching the last `page`, the actual `count` may be lower than the `limit` applied to query the data.'
          default: 15
          example: 15
    FormalityStateEnum:
      title: FormalityStateEnum
      description: The global state of a formality.
      type: string
      enum:
        - created
        - ready
        - processing
        - inputRequired
        - error
        - completed
        - canceled
    FormalityMessage:
      title: FormalityMessage
      description: |
        While processing a formality, informational messages or warnings/errors may be added to the formality.
        They will be returned in this array.
      type: object
      required:
        - level
        - message
      properties:
        level:
          type: string
          enum:
            - info
            - warning
            - error
        message:
          description: |
            The actual message
          type: string
        field:
          description: |
            In the case that the message refers to a specific field in the request data structure, the navigation
            to the field will be supplied here.
          type: string
    FormalityObject:
      title: FormalityObject
      type: string
      description: |
        The object field of a formality indicates the type of formality being created.
        This will always match a value from the FormalityTypeEnum.
        In order to avoid breaking changes in consumer's codebases when introducing a new formality however,
        the enumeration is not being applied to this field.
        Consumers are strongly advised to implement a default fallback strategy when a type is being returned
        that has not been implemented on their end.
    FormalitySubject:
      title: FormalitySubject
      type: object
      required:
        - parties
        - assets
      properties:
        parties:
          type: array
          items:
            type: object
            required:
              - partyId
            properties:
              partyId:
                $ref: '#/components/schemas/ModelIdentifier'
        assets:
          type: array
          items:
            type: object
            required:
              - assetId
            properties:
              assetId:
                $ref: '#/components/schemas/ModelIdentifier'
    BaseFormalityStateUpdate:
      title: BaseFormalityStateUpdate
      type: object
      properties:
        state:
          $ref: '#/components/schemas/FormalityStateEnum'
    BaseFormalitySubjectUpdate:
      title: BaseFormalitySubjectUpdate
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/FormalitySubject'
    BeNrnIdentificationNumber:
      title: BeNrnIdentificationNumber
      description: |
        Identifier for a natural person with the Belgian National Register
      type: object
      allOf:
        - $ref: '#/components/schemas/IdentificationNumber'
        - type: object
          properties:
            number:
              type: string
              pattern: "^[0-9]{11}$"
    PartialDate:
      title: PartialData
      description: A partial date is a string representing a date in the ISO8601 YYYY-MM-DD format where the month and date part are optional, and can be omitted.
      type: string
      pattern: ^(1[8-9]\d{2}|20\d{2})$|^(1[8-9]\d{2}|20\d{2})-(01|03|05|07|08|10|12)(-((0[1-9])|([12][0-9])|(3[01])))?$|^(1[8-9]\d{2}|20\d{2})-(04|06|09|11)(-((0[1-9])|[12][0-9]|30))?$|^(1[8-9]\d{2}|20\d{2})-02(-([012][1-9]))?$
