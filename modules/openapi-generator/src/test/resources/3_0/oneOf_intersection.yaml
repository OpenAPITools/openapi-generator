    Municipality:
      title: Municipality
      description: A municipality
      type: object
      required:
        - name
      properties:
        name:
          type: string
        nisCode:
          type: string
          description: The NIS code for the municipality.  Please note that this information is not always available.
    NaturalPersonStateEnum:
      title: NaturalPersonStateEnum
      description: |
        The state of the natural person.
        The most common states are
        - alive
        - deceased
        
        However, in some rare cases, the state can also be
        - disappeared
        - unknown
        
        Unknown is used in case of scratched persons with conflicting states between the national register and the registers of CBSS.
      type: string
      enum:
        - alive
        - deceased
        - disappeared
        - unknown
    Address:
      title: Address
      description: |
        A representation of an address.
        Addresses can be either structured or unstructured.
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ObjectType'
        country:
          $ref: '#/components/schemas/CountryEnum'
      discriminator:
        propertyName: object
        mapping:
          structuredAddress: '#/components/schemas/StructuredAddress'
          unstructuredAddress: '#/components/schemas/UnstructuredAddress'
    NaturalPersonUnknownNationalityEnum:
      title: NaturalPersonUnknownNationalityEnum
      description: |
        In some cases the nationality of a party is unknown.
        In these cases one of these codes will be returned.
        
        - XA: stateles
        - XB: not proven
        - XC: abroad
        - XD: at sea (international waters)
        - XE: undefined
      type: string
      enum:
        - XA
        - XB
        - XC
        - XD
        - XE
    BeCbenIdentificationNumber:
      title: BeCbenIdentificationNumber
      description: |
        Identifier for a legal person registered with the Belgian Crossroads Bank For Enterprise
      allOf:
        - $ref: '#/components/schemas/IdentificationNumber'
        - type: object
          properties:
            number:
              type: string
              pattern: "^(BE)?[0-1][0-9]{9}$"
    StructuredAddress:
      title: StructuredAddress
      description: |
        A structured address
      type: object
      required:
        - object
        - street
        - houseNumber
        - postalCode
        - municipality
        - country
      allOf:
        - $ref: '#/components/schemas/Address'
        - type: object
          properties:
            street:
              $ref: '#/components/schemas/Street'
            houseNumber:
              type: string
            unitNumber:
              type: string
            postalCode:
              type: string
            municipality:
              $ref: '#/components/schemas/Municipality'
            region:
              description: |
                Province or state for the address as the subdivision of the country. (Optional)
              type: string
              example: 'California'
    PartyFiliationFormalityResult:
      title: PartyFiliationFormalityResult
      type: object
      allOf:
        - $ref: '#/components/schemas/FormalityResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PartyFiliationFormalityResultData'
    PartyLegalDisabilityFormalityResult:
      title: PartyLegalDisabilityFormalityResult
      type: object
      allOf:
        - $ref: '#/components/schemas/FormalityResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PartyLegalDisabilityFormalityResultData'
    PartySearchNaturalPersonByNrnCreate:
      title: PartySearchNaturalPersonByNrnCreate
      type: object
      required:
        - object
        - nrns
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - 'naturalPerson'
        nrns:
          type: array
          description: |
            Search for parties based on a (list of) NRNs
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/BeNrnIdentificationNumber'
    PartySearchNaturalPersonByNameCreate:
      title: PartySearchNaturalPersonByNameCreate
      type: object
      required:
        - object
        - lastName
        - birthDate
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - 'naturalPerson'
        lastName:
          description: The last name.
          type: string
        firstName:
          description: The first name.
          type: string
        birthDate:
          $ref: '#/components/schemas/PartialDate'
    PartySearchNaturalPersonByAddressCreate:
      title: PartySearchNaturalPersonByAddressCreate
      type: object
      required:
        - object
        - address
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - 'naturalPerson'
        address:
          type: object
          required:
            - postalCode
            - streetCode
            - houseNumber
          properties:
            postalCode:
              type: string
            streetCode:
              description: the code of the street
              type: string
              pattern: ^\d{4}$
            houseNumber:
              type: string
            unitNumber:
              type: string
    PartySearchLegalPersonByCbenCreate:
      title: PartySearchLegalPersonByCbenCreate
      type: object
      required:
        - object
        - cbens
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - 'legalPerson'
        cbens:
          type: array
          description: |
            Search for legal parties based on a (list of) CBE numbers
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/BeCbenIdentificationNumber'
    PartySearchLegalPersonByNameAddressCreate:
      title: PartySearchLegalPersonByNameAddressCreate
      type: object
      required:
        - object
      additionalProperties: false
      properties:
        object:
          type: string
          enum:
            - 'legalPerson'
        onlyActiveEnterprises:
          description: filter to search on only active enterprises
          type: boolean
          default: true
        enterpriseName:
          description: The name of the enterprise.
          type: string
          maxLength: 48
        enterpriseType:
          type: string
          enum:
            - legalPerson
            - physicalPerson
        postalCode:
          type: string
        streetCode:
          type: string
          pattern: ^\d{4}$
          example: "2022"
        houseNumber:
          type: string
        nisCode:
          type: string
          pattern: ^\d{5}$
          example: "24062"
    IdentificationNumber:
      title: IdentificationNumber
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          BeNrn: '#/components/schemas/BeNrnIdentificationNumber'
          BeCben: '#/components/schemas/BeCbenIdentificationNumber'
    UnstructuredAddress:
      title: UnstructuredAddress
      description: |
        An unstructured address
      type: object
      required:
        - object
        - lines
        - country
      allOf:
        - $ref: '#/components/schemas/Address'
        - type: object
          properties:
            object:
              $ref: '#/components/schemas/ObjectType'
            lines:
              type: array
              minItems: 1
              maxItems: 4
              items:
                type: string
    Street:
      title: Street
      description: A street
      type: object
      required:
        - name
      properties:
        name:
          type: string
        streetCode:
          type: string
          description: |
            A four-digit code that defines a street in the municipality. 
            This code is assigned by the National Register (IT020), upon request and in consultation with the municipality.
          pattern: ^\d{4}$
    FormalityResult:
      #
      # obsolete, use BaseFormalityResult instead
      #
      title: FormalityResult
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/FormalityResultTypeEnum'


        documents:
          type: array
          items:
            $ref: '#/components/schemas/FormalityDocument'
    PartyFiliationFormalityResultData:
      title: PartyFiliationFormalityResultData
      type: object
      required:
        - parentsData
        - descendantsData
      properties:
        parentsData:
          type: array
          items:
            $ref: '#/components/schemas/NaturalPersonFiliationParents'
        descendantsData:
          type: array
          items:
            $ref: '#/components/schemas/NaturalPersonFiliationDescendants'
    PartyLegalDisabilityFormalityResultData:
      title: PartyLegalDisabilityFormalityResultData
      type: object
      # required:
      #   - juridicalCapacityState
      #   - juridicalCapacityAssistant
      properties:
        legalDisability:
          $ref: '#/components/schemas/NaturalPersonLegalDisability'
        legalGuardian:
          $ref: '#/components/schemas/NaturalPersonLegalGuardian'
    FormalityResultTypeEnum:
      title: FormalityResultTypeEnum
      description: |
        The result type of the formality.
        In order to increase user experience, the result type of the formality makes it possible to provide additional user hints
        to the user in a UI.
        
        The states success / fail are typically returned by our services when an interpretation of the results can be done.
        E.g. a check with JustBan could include a success or fail result.  Formalities that return a set of data or documents, will typically
        only return result processed, indicating that the response data is now available.
      type: string
      enum:
        - success
        - fail
        - available
        - notApplicable
    FormalityDocument:
      title: FormalityDocument
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ModelIdentifier'
    NaturalPersonFiliationParents:
      title: NaturalPersonFiliationParents
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        descentType:
          description: Element of codeList NaturalPersonDescentType
          type: string
        relatives:
          type: array
          items:
            $ref: '#/components/schemas/NaturalPersonRelated'
        filiationPlaceDocuments:
          type: object
          properties:
            filiationAct:
              type: string
            filiationActPlace:
              type: string
        comment:
          type: string
    NaturalPersonFiliationDescendants:
      title: NaturalPersonFiliationDescendants
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        descentType:
          description: Element of codeList NaturalPersonDescentType
          type: string
        relatives:
          type: array
          items:
            $ref: '#/components/schemas/NaturalPersonRelated'
        filiationPlaceDocuments:
          type: object
          properties:
            filiationAct:
              type: string
            filiationActPlace:
              type: string
        justification:
          type: string
        comment:
          type: string
    NaturalPersonLegalDisability:
      title: NaturalPersonLegalDisability
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        judicialStatus:
          description: Element of codeList NaturalPersonLegalDisabilityJudicialStatus
          type: string
        justification:
          description: Element of codeList NaturalPersonLegalDisabilityJustification
          type: string
        comment:
          type: string
    NaturalPersonLegalGuardian:
      title: NaturalPersonLegalGuardian
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        judicialStatus:
          description: Element of codeList NaturalPersonLegalGuardianJudicialStatus
          type: string
        justification:
          description: Element of codeList NaturalPersonLegalGuardianJustification
          type: string
        nrn:
          $ref: '#/components/schemas/BeNrnIdentificationNumber'
        name:
          type: string
        comment:
          type: string


    Period:
      title: Period
      description: A period in time starting a certain date, and optionally ending on a certain date
      type: object
      required:
        - startDate
      properties:
        startDate:
          $ref: '#/components/schemas/PartialDate'
        endDate:
          $ref: '#/components/schemas/PartialDate'
    NaturalPersonRelated:
      title: NaturalPersonRelated
      type: object
      description: |
        NaturalPerson related to another NaturalPerson (e.g; parents and childeren)
        ! To avoid direct calls using getExtended (causing MyData, MyDossier visibility), basic info of the related person is returned.
        ! Gender is not included since it's gdpr sensitive and considered not needed
      properties:
        # Creating id's can cause errors when the returned nrn isn't valid, what happens in some cases, e.g. parents never been created in NR.
        # id:
        #   $ref: '../../../dependencies/common-definitions.yaml#/components/schemas/ModelIdentifier'
        nrn:
          $ref: '#/components/schemas/BeNrnIdentificationNumber'
        lastNames:
          type: array
          minItems: 1
          items:
            type: string
        firstNames:
          type: array
          minItems: 0
          items:
            type: string
        birthDate:
          $ref: '#/components/schemas/PartialDate'
  parameters:
    Header.AcceptLanguage:
      name: Accept-Language
      in: header
      required: true
      schema:
        type: string
        pattern: '^([a-zA-Z]{1,8}(-[a-zA-Z]{1,8})?)(;\s*q=0(\.[0-9]{1,3})?|;\s*q=1(\.0{1,3})?)?(\s*,\s*([a-zA-Z]{1,8}(-[a-zA-Z]{1,8})?)(;\s*q=0(\.[0-9]{1,3})?|;\s*q=1(\.0{1,3})?)?)*$'
      description: |
        Defines the language in which you would like to have all internationalised strings returned.
    Header.RequiredGlobalTransactionId:
      name: X-Global-Transaction-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: |
        The global transaction id is an identifier that can be set by an (external) consumer.
        When missing, API GW will inject a new value.
        The header should propagate throughout all internal calls between services.

    # Pagination
    Query.Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: The offset determining the first result which will be returned. The offset is zero based
    Query.Limit:
      in: query
      name: limit
      description: The number of items which will be included in the search
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 50
        default: 15



    # Filters
    Query.IdsFilter:
      in: query
      name: ids
      description: Filters the collection by id.  Allows for easy retrieval of a collection of resources by their identifier.
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ModelIdentifier'
      style: form
      explode: false
    Query.ObjectFilter:
      in: query
      name: object
      description: Filters the collection by type of object.
      required: false
      schema:
        type: string
    Path.Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ModelIdentifier'
      description: Uniquely identifies the resource being retrieved from the server.
    Path.CodeListType:
      name: codeListType
      in: path
      description: Filters the code list.
      required: true
      schema:
        $ref: '#/components/schemas/CodeListType'
    Header.RequiredFormalityId:
      name: X-Centralis-Formality-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/ModelIdentifier'
      description: |
        (Optionally) Identifies the Centralis Formality for which the call is being made.
  responses:
    ServiceInfoResponse:
      description: Info about the service
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServiceInfo'
    Error:
      description: Error response object returned for each server error.
      headers:
        X-Global-Transaction-Id:
          $ref: '#/components/headers/Header.ResponseGlobalTransactionId'
        X-Correlation-Id:
          $ref: '#/components/headers/Header.ResponseCorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PartySearch:
      description: The party search.
      headers:
        X-Global-Transaction-Id:
          $ref: '#/components/headers/Header.ResponseGlobalTransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartySearch'
    PartyCollection:
      description: A list of parties matching the request.
      headers:
        X-Global-Transaction-Id:
          $ref: '#/components/headers/Header.ResponseGlobalTransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartyCollection'
    Party:
      description: The party.
      headers:
        X-Global-Transaction-Id:
          $ref: '#/components/headers/Header.ResponseGlobalTransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Party'
    CheckPartyExistence:
      description: A list of parties matching the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartyIdCollection'
    PartiesNrn:
      description: A list of parties/nrn tuples matching the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartyIdNrnCollection'
    PartiesUuid:
      description: A list of parties/nrn tuples matching the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartyNrnIdCollection'
    CodeList:
      description: |
        The collection of the codes, from the requested code-list,  and their translated values.
        Each code returned also contains its value in the language that was provided by the Accept-Language header of the request.
      headers:
        X-Global-Transaction-Id:
          $ref: '#/components/headers/Header.ResponseGlobalTransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodeListValueCollection'
    FormalityCollection:
      description: A list of formalities matching the request.
      headers:
        X-Global-Transaction-Id:
          $ref: '#/components/headers/Header.ResponseGlobalTransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormalityCollection'
    Formality:
      description: The formality.
      headers:
        X-Global-Transaction-Id:
          $ref: '#/components/headers/Header.ResponseGlobalTransactionId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Formality'
  headers:
    Header.ResponseGlobalTransactionId:
      schema:
        type: string
        format: uuid
      description: |
        The global transaction id is an identifier that can be set by an (external) consumer.
        When missing, API GW will inject a new value.
        The header should propagate throughout all internal calls between services.
    Header.ResponseCorrelationId:
      schema:
        type: string
        format: uuid
      description: |
        The correlation id is an internal identifier used by fednot for auditing purposes.
        It is injected by API GW and should propagate throughout all internal calls between services.
  requestBodies:
    CreatePartySearchRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartySearchCreate'

    CheckPartyExistenceRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartyIdCollection'
    PartyNrnRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartyIdCollection'
    PartyUuidRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartyNrn'
    CreateFormalityRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormalityCreate'

    UpdateFormalityRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormalityUpdate'
