openapi: 3.0.3
info:
  title: URI validation annotations
  version: 1.0.0
paths:
  /uri-payload:
    get:
      operationId: getUriPayload
      parameters:
        - in: query
          name: uriParam
          schema:
            type: string
            format: uri
            pattern: '^https?://'
            minLength: 1
        - in: query
          name: uriParamMaxLength
          schema:
            type: string
            format: uri
            maxLength: 10
        - in: query
          name: uriParamMinMaxLength
          schema:
            type: string
            format: uri
            minLength: 2
            maxLength: 12
        - in: query
          name: plainStringParam
          schema:
            type: string
            pattern: '^[a-z]+$'
            minLength: 1
        - in: query
          name: plainStringParamMaxLength
          schema:
            type: string
            maxLength: 10
        - in: query
          name: plainStringParamMinMaxLength
          schema:
            type: string
            minLength: 2
            maxLength: 12
      responses:
        '200':
          description: URI payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UriPayload'
components:
  schemas:
    UriPayload:
      type: object
      properties:
        uri:
          type: string
          format: uri
          pattern: '^https?://'
          minLength: 1
        plainString:
          type: string
          pattern: '^[a-z]+$'
          minLength: 1
        uriMaxLength:
          type: string
          format: uri
          maxLength: 10
        uriMinMaxLength:
          type: string
          format: uri
          minLength: 2
          maxLength: 12
        plainStringMaxLength:
          type: string
          maxLength: 10
        plainStringMinMaxLength:
          type: string
          minLength: 2
          maxLength: 12
