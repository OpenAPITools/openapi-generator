openapi: 3.0.1
info:
  title: Kotlin Spring body param validation
  version: 1.0.0
paths:
  /bodies/list:
    post:
      operationId: postList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: ok
  /bodies/optional-list:
    post:
      operationId: postOptionalList
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: ok
  /bodies/set:
    post:
      operationId: postSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: ok
  /bodies/map:
    post:
      operationId: postMap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: ok
  /bodies/sized-list:
    post:
      operationId: postSizedList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 2
              items:
                $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: ok
  /bodies/flow-list:
    post:
      operationId: postFlowList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Item'
      responses:
        '200':
          description: ok
components:
  schemas:
    Item:
      type: object
      properties:
        name:
          type: string
          maxLength: 3
