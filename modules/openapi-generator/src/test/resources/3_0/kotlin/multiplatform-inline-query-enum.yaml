openapi: 3.0.3
info:
  description: >-
    Example created
  version: 1.0.0
  title: OpenAPI Stuff API created to reproduce issue
  license:
    name: Apache-2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
paths:
  /healthcheck/{X-Allow-Foo-Path}/{X-Allow-Foo-Path-Ref}:
    get:
      parameters:
       - name: X-Allow-Foo-Header
         in: header
         schema:
           type: string
           enum:
             - '0'
             - '1'
           x-enum-varnames:
            - DISALLOW
            - ALLOW
       - name: X-Allow-Foo-Header-Ref
         in: header
         schema:
           $ref: '#/components/schemas/AllowFoo'
       - name: X-Allow-Foo-Query
         in: query
         schema:
           type: string
           enum:
             - 'y'
             - 'n'
           x-enum-varnames:
             - YEP
             - NOPE
       - name: X-Allow-Foo-Query-Ref
         in: query
         schema:
           $ref: '#/components/schemas/AllowFooYn'
       - name: X-Allow-Foo-Path
         in: path
         required: true
         schema:
           type: string
           enum:
             - '0'
             - '1'
           x-enum-varnames:
             - ZERO
             - ONE
       - name: X-Allow-Foo-Path-Ref
         in: path
         required: true
         schema:
           $ref: '#/components/schemas/AllowFooPath'
      summary: Health check endpoint.
      operationId: healthcheck
      responses:
        204:
          description: Successful health check
        default:
          description: Unexpected error
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  schemas:
    ApiError:
      required:
        - errorCode
      type: object
      properties:
        errorCode:
          type: integer
          enum:
            - 0
            - 100
          x-enum-varnames:
            - OK
            - ERROR
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
    ReasonCode:
      type: integer
      enum:
        - 10
        - 20
    AllowFoo:
      type: string
      enum:
        - '0'
        - '1'
      x-enum-varnames:
        - DISALLOW
        - ALLOW
    AllowFooYn:
      type: string
      enum:
        - 'y'
        - 'n'
      x-enum-varnames:
        - YEP
        - NOPE
    AllowFooPath:
      type: string
      enum:
        - '0'
        - '1'
      x-enum-varnames:
        - ZERO
        - ONE
