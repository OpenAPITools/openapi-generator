openapi: 3.0.3
info:
  title: Kotlin MicroProfile example
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
paths:
  /echo:
    post:
      tags: [pet]
      operationId: echoNullable
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
            nullable: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              nullable: true
      responses:
        '204':
          description: Accepted
  /maybe-name:
    get:
      tags: [pet]
      operationId: getNullableName
      responses:
        '200':
          description: Nullable name
          content:
            application/json:
              schema:
                type: string
                nullable: true
  /pets/{petId}:
    get:
      tags: [pet]
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: filter
          in: query
          schema:
            type: string
        - name: X-Request-Id
          in: header
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [pet]
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
  /pets:
    post:
      tags: [pet]
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    get:
      tags: [pet]
      operationId: listPets
      parameters:
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required: [id, name, nickname, labels]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nickname:
          type: string
          nullable: true
        labels:
          type: array
          items:
            type: string
            nullable: true
        age:
          type: integer
        adoptedOn:
          type: string
          format: date
