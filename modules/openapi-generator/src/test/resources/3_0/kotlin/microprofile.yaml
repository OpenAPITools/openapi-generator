openapi: 3.0.3
info:
  title: Kotlin MicroProfile example
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
paths:
  /animals:
    post:
      tags: [pet]
      operationId: createAnimal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Animal'
      responses:
        '200':
          description: The submitted animal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
  /alternatives/{kind}:
    get:
      tags: [pet]
      operationId: getAlternative
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A discriminated alternative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alternative'
  /animals/{kind}:
    get:
      tags: [pet]
      operationId: getAnimal
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A polymorphic animal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
  /choices/{kind}:
    get:
      tags: [pet]
      operationId: getChoice
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A discriminated union
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Choice'
  /maybe-pet:
    get:
      tags: [pet]
      operationId: getNullablePet
      responses:
        '200':
          description: A pet or null
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Pet'
  /echo:
    post:
      tags: [pet]
      operationId: echoNullable
      parameters:
        - name: value
          in: query
          required: true
          schema:
            type: string
            nullable: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              nullable: true
      responses:
        '204':
          description: Accepted
  /maybe-name:
    get:
      tags: [pet]
      operationId: getNullableName
      responses:
        '200':
          description: Nullable name
          content:
            application/json:
              schema:
                type: string
                nullable: true
  /pets/{petId}:
    get:
      tags: [pet]
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: filter
          in: query
          schema:
            type: string
        - name: X-Request-Id
          in: header
          schema:
            type: string
        - name: session
          in: cookie
          schema:
            type: string
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [pet]
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
  /pets:
    post:
      tags: [pet]
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    get:
      tags: [pet]
      operationId: listPets
      parameters:
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
components:
  schemas:
    Alternative:
      anyOf:
        - $ref: '#/components/schemas/FirstChoice'
        - $ref: '#/components/schemas/SecondChoice'
      discriminator:
        propertyName: kind
        mapping:
          first: '#/components/schemas/FirstChoice'
          second: '#/components/schemas/SecondChoice'
    Animal:
      type: object
      required: [name, nickname]
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
      properties:
        kind:
          type: string
        name:
          type: string
        nickname:
          type: string
          nullable: true
    Cat:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          required: [lives]
          properties:
            lives:
              type: integer
    Dog:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          properties:
            breed:
              type: string
    Choice:
      oneOf:
        - $ref: '#/components/schemas/FirstChoice'
        - $ref: '#/components/schemas/SecondChoice'
      discriminator:
        propertyName: kind
        mapping:
          first: '#/components/schemas/FirstChoice'
          second: '#/components/schemas/SecondChoice'
    FirstChoice:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
        text:
          type: string
    SecondChoice:
      type: object
      required: [kind, number]
      properties:
        kind:
          type: string
        number:
          type: integer
    Pet:
      type: object
      required: [id, name, nickname, labels]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nickname:
          type: string
          nullable: true
        labels:
          type: array
          items:
            type: string
            nullable: true
        age:
          type: integer
        adoptedOn:
          type: string
          format: date
