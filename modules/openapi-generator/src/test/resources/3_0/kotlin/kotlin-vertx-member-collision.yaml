openapi: 3.0.3
info: {title: a4 repro, version: '1.0'}
components:
  securitySchemes:
    basicAuth: {type: http, scheme: basic}
    bearerAuth: {type: http, scheme: bearer}
    apiKeyAuth: {type: apiKey, in: header, name: X-API-KEY}
paths:
  /basic:
    get:
      operationId: basicOp
      security: [{basicAuth: []}]
      parameters:
        - {name: username, in: query, schema: {type: string}}
        - {name: password, in: query, schema: {type: string}}
      responses: {'200': {description: ok}}
  /bearer:
    get:
      operationId: bearerOp
      security: [{bearerAuth: []}]
      parameters:
        - {name: accessToken, in: query, schema: {type: string}}
      responses: {'200': {description: ok}}
  /apikey:
    get:
      operationId: apiKeyOp
      security: [{apiKeyAuth: []}]
      parameters:
        - {name: apiKey, in: query, schema: {type: string}}
        - {name: apiKeyPrefix, in: query, schema: {type: string}}
      responses: {'200': {description: ok}}
  /base:
    get:
      operationId: baseOp
      parameters:
        - {name: basePath, in: query, schema: {type: string}}
        - {name: vertx, in: query, schema: {type: string}}
      responses: {'200': {description: ok}}
