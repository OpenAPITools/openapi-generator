openapi: 3.0.3
info:
  title: request body extra annotation
  version: 1.0.0
paths:
  /employees:
    post:
      tags:
        - employee
      operationId: createEmployee
      x-request-body-extra-annotation: "@com.example.MyValidation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          description: created
  /employees/bulk:
    post:
      tags:
        - employee
      operationId: createEmployeeBulk
      x-request-body-extra-annotation:
        - "@com.example.MyValidation"
        - "@com.example.AuditLogged"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          description: created
  /employees/plain:
    post:
      tags:
        - employee
      operationId: createEmployeePlain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          description: created
  /employees/inline-annotation:
    post:
      tags:
        - employee
      operationId: createEmployeeInlineAnnotation
      # annotation placed directly on the requestBody object (per-operation, selective)
      requestBody:
        x-field-extra-annotation: "@com.example.InlineBodyValidation"
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '201':
          description: created
  /employees/reusable-a:
    post:
      tags:
        - employee
      operationId: createEmployeeReusableA
      requestBody:
        $ref: '#/components/requestBodies/AnnotatedEmployeeBody'
      responses:
        '201':
          description: created
  /employees/reusable-b:
    post:
      tags:
        - employee
      operationId: createEmployeeReusableB
      requestBody:
        $ref: '#/components/requestBodies/AnnotatedEmployeeBody'
      responses:
        '201':
          description: created
components:
  requestBodies:
    # reusable request body: the annotation applies to every operation that $refs it
    AnnotatedEmployeeBody:
      x-field-extra-annotation:
        - "@com.example.ReusableBodyValidation"
        - "@com.example.ReusableAuditLogged"
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Employee'
  schemas:
    Employee:
      type: object
      properties:
        name:
          type: string
