openapi: 3.1.0
info:
  title: discriminator_constants
  version: 1.0.0
servers:
  - url: /
components:
  schemas:
    PetType:
        type: string
        enum:
          - CAT
          - DOG
    Pet:
      properties:
        type:
          $ref: '#/components/schemas/PetType'
      discriminator:
        mapping:
          CAT: "#/components/schemas/Cat"
          DOG: "#/components/schemas/Dog"
        propertyName: type

    Cat:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - description: A representation of a cat
          properties:
            huntingSkill:
              description: The measured skill for hunting
    #          enum:
    #            - clueless
    #            - lazy
    #            - adventurous
    #            - aggressive
              type: string
          required:
            - huntingSkill
            - type
          example: null
    Dog:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - description: A representation of a dog
          properties:
            packSize:
              default: 0
              description: the size of the pack the dog is from
              format: int32
              minimum: 0
              type: integer
          required:
            - packSize
            - type
          example: null