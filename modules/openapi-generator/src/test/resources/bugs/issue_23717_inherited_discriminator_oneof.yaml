openapi: 3.0.0
info:
  title: Test API
  version: v1
paths: {}
components:
  schemas:
    Animal:
      type: object
      discriminator:
        propertyName: type
        mapping:
          Bird: '#/components/schemas/Bird'
          Reptile: '#/components/schemas/Reptile'
          Lizard: '#/components/schemas/Lizard'
          Snake: '#/components/schemas/Snake'
      properties:
        type:
          type: string
    Bird:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          properties:
            wingSpan:
              type: number
              format: double
    Reptile:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          properties:
            scaleColor:
              type: string
      oneOf:
        - $ref: '#/components/schemas/Lizard'
        - $ref: '#/components/schemas/Snake'
    Lizard:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          properties:
            canRegrowTail:
              type: boolean
    Snake:
      allOf:
        - $ref: '#/components/schemas/Animal'
        - type: object
          properties:
            venomous:
              type: boolean
