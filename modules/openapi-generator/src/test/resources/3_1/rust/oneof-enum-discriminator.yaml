openapi: 3.1.0
info:
  title: oneOf with enum discriminators
  version: 1.0.0
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shape'
components:
  schemas:
    # the tag is an inline single-value enum in every variant
    Pet:
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: petType
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
    Cat:
      type: object
      required:
        - petType
        - name
      properties:
        petType:
          type: string
          enum: [cat]
        name:
          type: string
    Dog:
      type: object
      required:
        - petType
        - breed
      properties:
        petType:
          type: string
          enum: [dog]
        breed:
          type: string
    # the tag is a $ref to an enum shared by the variants
    ShapeKind:
      type: string
      enum: [circle, square]
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
      discriminator:
        propertyName: kind
        mapping:
          circle: '#/components/schemas/Circle'
          square: '#/components/schemas/Square'
    Circle:
      type: object
      required:
        - kind
        - radius
      properties:
        kind:
          $ref: '#/components/schemas/ShapeKind'
        radius:
          type: number
    Square:
      type: object
      required:
        - kind
        - side
      properties:
        kind:
          $ref: '#/components/schemas/ShapeKind'
        side:
          type: number
    # the tag is an optional inline enum: the union writes it when the variant leaves it unset
    Note:
      oneOf:
        - $ref: '#/components/schemas/TextNote'
        - $ref: '#/components/schemas/LinkNote'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextNote'
          link: '#/components/schemas/LinkNote'
    TextNote:
      type: object
      properties:
        kind:
          type: string
          enum: [text]
        body:
          type: string
    LinkNote:
      type: object
      properties:
        kind:
          type: string
          enum: [link]
        href:
          type: string
    # a plain string tag keeps the serde tag
    Event:
      oneOf:
        - $ref: '#/components/schemas/Click'
        - $ref: '#/components/schemas/Scroll'
      discriminator:
        propertyName: type
        mapping:
          click: '#/components/schemas/Click'
          scroll: '#/components/schemas/Scroll'
    Click:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        x:
          type: integer
    Scroll:
      type: object
      required:
        - type
      properties:
        type:
          type: string
        dy:
          type: integer
