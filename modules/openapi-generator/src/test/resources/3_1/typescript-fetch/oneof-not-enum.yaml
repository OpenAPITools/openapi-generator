openapi: 3.1.0
info:
  title: TypeScript not enum reproduction
  version: 1.0.0
paths: {}
components:
  schemas:
    Known:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [known]

    Other:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          not:
            enum: [known]

    TaggedUnion:
      oneOf:
        - $ref: '#/components/schemas/Known'
        - $ref: '#/components/schemas/Other'

    MultipleExcluded:
      type: object
      properties:
        kind:
          type: string
          not:
            enum:
              - known
              - 'a"b'

    SanitizedExcluded:
      type: object
      required: [file-path]
      properties:
        file-path:
          type: string
          not:
            enum: [known]

    NullableExcluded:
      type: object
      required: [kind]
      properties:
        kind:
          type: [string, 'null']
          not:
            enum: [known, null]

    MixedExcluded:
      type: object
      properties:
        kind:
          type: string
          not:
            enum: [known, 42, true]
