openapi: 3.1.0
info:
  title: Repro bare null property
  version: 1.0.0
components:
  schemas:
    Child:
      type: object
      properties:
        name:
          type: string

    # a component schema that is itself a bare null type
    NullAlias:
      type: "null"

    # a referenced one-member allOf wrapper with its own description and extension
    NullWrapperAllOf:
      description: "Wrapper description on allOf schema"
      x-wrapper-ext: "wrapper-extension-value"
      allOf:
        - $ref: "#/components/schemas/NullAlias"

    ParentBareNull:
      type: object
      properties:
        # 1. property: Swashbuckle emits this shape for an untyped / `dynamic` member
        dyn:
          type: "null"
        # 2. array items
        dynList:
          type: array
          items:
            type: "null"
        # 3. property that $refs a null-typed component schema
        dynRef:
          $ref: "#/components/schemas/NullAlias"
        # 4. property that $refs a null-typed component schema with sibling metadata
        dynRefWithDesc:
          $ref: "#/components/schemas/NullAlias"
          description: "Sibling description for bare null ref"
        # 5. property with explicit nullable: false that $refs null-typed schema
        dynRefExplicitNotNullable:
          $ref: "#/components/schemas/NullAlias"
          nullable: false
        # 6. untyped schema with validation constraints, should NOT be converted to bare null
        patternProp:
          pattern: "^[a-z]+$"
        # 7. property that $refs a one-member allOf wrapper around null schema
        dynRefToAllOfWrapper:
          $ref: "#/components/schemas/NullWrapperAllOf"
        # 8. property that $refs a one-member allOf wrapper with sibling description overriding wrapper
        dynRefToAllOfWrapperWithSiblingDesc:
          $ref: "#/components/schemas/NullWrapperAllOf"
          description: "Overridden description on property"
        # control: an ordinary $ref property, which stays correct
        child:
          $ref: "#/components/schemas/Child"
