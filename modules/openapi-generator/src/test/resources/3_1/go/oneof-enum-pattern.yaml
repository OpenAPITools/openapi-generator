openapi: 3.0.3
info:
  title: Go oneOf validation
  version: 1.0.0
paths: {}
components:
  schemas:
    File:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [file]
        path:
          type: string
          nullable: true
          pattern: '^/.*'
    Folder:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [folder]
    Metadata:
      oneOf:
        - $ref: '#/components/schemas/File'
        - $ref: '#/components/schemas/Folder'
