openapi: 3.1.0
info:
  title: Dart Dio optional nullable query parameter test
  version: 1.0.0
paths:
  /items:
    get:
      operationId: getItems
      parameters:
        - name: activity_id
          in: query
          required: false
          schema:
            anyOf:
              - type: integer
              - type: "null"
            title: Activity Id
        - name: category_id
          in: query
          required: false
          schema:
            type: integer
            title: Category Id
        - name: required_id
          in: query
          required: true
          schema:
            type: integer
            title: Required Id
        - name: required_nullable_id
          in: query
          required: true
          schema:
            anyOf:
              - type: integer
              - type: "null"
            title: Required Nullable Id
      responses:
        "200":
          description: Successful response
