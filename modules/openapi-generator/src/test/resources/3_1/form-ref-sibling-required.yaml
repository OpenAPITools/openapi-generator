openapi: 3.1.0
info:
  title: form required sibling of $ref
  version: 1.0.0
paths:
  /register-ref-sibling:
    post:
      operationId: registerRefSibling
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/RefCarryingRequired'
      responses:
        '200':
          description: ok
  /register-inline-sibling:
    post:
      operationId: registerInlineSibling
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/Base'
                  required:
                    - extra
      responses:
        '200':
          description: ok
  /register-ref-allof-sibling:
    post:
      operationId: registerRefAllofSibling
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/RefWithSiblingAllOf'
      responses:
        '200':
          description: ok
  /register-ref-oneof-sibling:
    post:
      operationId: registerRefOneofSibling
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/RefWithSiblingOneOf'
      responses:
        '200':
          description: ok
components:
  schemas:
    # OAS 3.1 (JSON Schema 2020-12) allows keywords next to $ref; the
    # `required` here must apply on top of the referenced schema's own list
    RefCarryingRequired:
      $ref: '#/components/schemas/Base'
      required:
        - extra
    Base:
      type: object
      required:
        - base_req
      properties:
        base_req:
          type: string
        extra:
          type: string
        optional_field:
          type: string
    # composition keywords may sit next to $ref too: the allOf member's
    # `required` must apply on top of the referenced schema's own list
    RefWithSiblingAllOf:
      $ref: '#/components/schemas/Base'
      allOf:
        - type: object
          required:
            - allof_req
          properties:
            allof_req:
              type: string
    # for oneOf only the entries every branch requires are guaranteed
    RefWithSiblingOneOf:
      $ref: '#/components/schemas/Base'
      oneOf:
        - type: object
          required:
            - oneof_req
          properties:
            oneof_req:
              type: string
        - type: object
          required:
            - oneof_req
          properties:
            oneof_req:
              type: string
            oneof_opt:
              type: string
