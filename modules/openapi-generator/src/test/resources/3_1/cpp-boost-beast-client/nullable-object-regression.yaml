    get:
      operationId: getNullableObject
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullableObjectRoot"
components:
  schemas:
    NullableObjectRoot:
      type: object
      nullable: true
      properties:
        id:
          type: string
        label:
          type: string