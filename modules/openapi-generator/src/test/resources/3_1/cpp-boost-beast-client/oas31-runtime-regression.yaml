openapi: 3.1.0
info:
  title: C++ Boost.Beast OAS 3.1 runtime regression
  version: 1.0.0
paths:
  /probe:
    get:
      operationId: getProbe
      responses:
        '200':
          description: Integer success
          content:
            application/json:
              schema:
                type: integer
        default:
          description: Composed fallback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fallback'
  /empty:
    get:
      operationId: getEmpty
      responses:
        '200':
          description: Empty any-type composition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/allNull'
  /stream:
    get:
      operationId: getStream
      responses:
        '200':
          description: Nullable JSON event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamChunk'
components:
  schemas:
    Base:
      type: object
      required: [base]
      properties:
        base:
          type: string
    A:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: a
    B:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: b
    mixed:
      allOf:
        - $ref: '#/components/schemas/Base'
      oneOf:
        - $ref: '#/components/schemas/A'
        - $ref: '#/components/schemas/B'
    Fallback:
      oneOf:
        - $ref: '#/components/schemas/A'
        - $ref: '#/components/schemas/B'
    allNull:
      anyOf:
        - type: "null"
        - type: "null"
    duplicateNull:
      oneOf:
        - type: "null"
        - type: "null"
    nonAsciiPattern:
      oneOf:
        - patternProperties:
            "^á": {}
          additionalProperties: false
    NestedUnion:
      oneOf:
        - type: string
          maxLength: 3
        - type: string
          minLength: 4
    OuterUnion:
      oneOf:
        - $ref: '#/components/schemas/NestedUnion'
        - type: boolean
    TaggedUnionContainer:
      type: object
      required: [direct, nested]
      properties:
        direct:
          $ref: '#/components/schemas/NestedUnion'
        nested:
          $ref: '#/components/schemas/OuterUnion'
    Simple:
      title: Simple
      type: object
      properties:
        value:
          type: string
    Zeta:
      title: Simple
      type: object
      properties:
        value:
          type: string
    DeduplicatedRefContainer:
      type: object
      properties:
        inner:
          type: object
          additionalProperties: false
          properties:
            first:
              $ref: '#/components/schemas/Simple'
            second:
              $ref: '#/components/schemas/Zeta'
    StreamChunk:
      type: object
      required: [id, required_nullable, required_referenced_nullable]
      properties:
        id:
          type: string
        inline_nullable:
          type: object
          nullable: true
          properties:
            value:
              type: string
        referenced_nullable:
          $ref: '#/components/schemas/Simple'
          nullable: true
        required_nullable:
          type: string
          nullable: true
        required_referenced_nullable:
          $ref: '#/components/schemas/Simple'
          nullable: true
