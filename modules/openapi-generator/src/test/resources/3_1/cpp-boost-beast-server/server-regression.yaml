openapi: 3.1.0
info:
  title: cpp-boost-beast-server regression
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - api_key: []
paths:
  /pets/{petId}:
    get:
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          description: Pet identifier
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: No such pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
    put:
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Updated pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: X-API-KEY
          in: header
          required: true
          description: API key header array (simple style)
          schema:
            type: array
            items:
              type: string
          style: simple
      responses:
        '204':
          description: Deleted
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: status
          in: query
          description: Filter by status enum
          schema:
            type: string
            enum: [available, sold]
        - name: tags
          in: query
          description: Pipe-delimited tag filter
          schema:
            type: array
            items:
              type: string
          style: pipeDelimited
          explode: false
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: tier
          in: query
          description: Numeric tier selector
          schema:
            type: integer
            format: int32
            enum: [10, 20]
      responses:
        '200':
          description: Pet collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
      security: []
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearer: []
  /reports/{reportId}:
    get:
      operationId: getReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Z]{2}-[0-9]+$'
          style: label
        - name: lang
          in: cookie
          schema:
            type: string
      responses:
        '200':
          description: The report
          content:
            application/vnd.report+json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearer: []
  /batch/{ids}:
    get:
      operationId: getBatch
      parameters:
        - name: ids
          in: path
          required: true
          description: Matrix-exploded identifier list
          schema:
            type: array
            items:
              type: string
          style: matrix
          explode: true
      responses:
        '200':
          description: Batch echo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      security: []
  /pets/bulk:
    get:
      operationId: getBulkPets
      description: Literal route declared after /pets/{petId} (ranking probe)
      responses:
        '200':
          description: Bulk pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
      security: []
  /search:
    get:
      operationId: search
      parameters:
        - name: filter
          in: query
          required: true
          description: Deep-object string map filter
          schema:
            type: object
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: sort
          in: query
          description: Space-delimited sort fields
          schema:
            type: array
            items:
              type: string
          style: spaceDelimited
          explode: false
      responses:
        '200':
          description: Search echo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      security: []
  /defaults:
    get:
      operationId: getDefaults
      description: Declared defaults, exclusive bounds, collection constraints
      parameters:
        - name: name
          in: query
          schema:
            type: string
            default: five
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 7
        - name: score
          in: query
          schema:
            type: number
            format: double
            exclusiveMinimum: 1.5
            exclusiveMaximum: 3
        - name: ids
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              minLength: 2
            minItems: 2
            uniqueItems: true
          style: form
          explode: false
      responses:
        '200':
          description: Echo of declared defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      security: []
  /periods/{year}-{month}/summary:
    get:
      operationId: getPeriod
      description: Embedded path expressions in one segment
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: month
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Period echo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      security: []
  /echo:
    post:
      operationId: postEcho
      description: Optional JSON body (decodes only when bytes arrive)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Echoed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
      security: []
  /codec:
    get:
      operationId: codec
      description: Float wire-grammar gates and fail-closed regex patterns
      parameters:
        - name: w
          in: query
          description: Unbounded float parameter for range/grammar probes
          schema:
            type: number
            format: float
        - name: code
          in: query
          description: Pattern outside the std::regex ECMAScript subset
          schema:
            type: string
            pattern: '^(?i)abc$'
        - name: codes
          in: query
          description: Item pattern with a dangling quantifier
          schema:
            type: array
            items:
              type: string
              pattern: '*oops'
          style: form
          explode: false
      responses:
        '200':
          description: Echo of the decoded float
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
      security: []
  /pick:
    get:
      operationId: getPick
      description: oneOf response model (std::variant of tagged branches)
      responses:
        '200':
          description: One selected branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pick'
      security: []
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
    bearer:
      type: http
      scheme: bearer
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum: [available, sold]
        tag:
          type: [string, 'null']
        photoUrls:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    Pick:
      oneOf:
        - {type: string, pattern: '^A'}
        - {type: string, pattern: '^B'}
    Report:
      type: object
      required: [title]
      properties:
        title:
          type: string
        createdAt:
          type: [string, 'null']
