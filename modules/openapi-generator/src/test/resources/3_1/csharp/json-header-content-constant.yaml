openapi: 3.1.0

info:
  title: JSON constant header repro
  version: 1.0.0

paths:
  /test:
    post:
      operationId: testJsonConstantHeader
      parameters:
        - name: X-Json-Const-Str
          in: header
          required: true
          content:
            application/json:
              schema:
                type: string
                enum:
                  - CONSTANT_VALUE
        - name: X-Json-Const-Int
          in: header
          required: true
          content:
            application/json:
              schema:
                type: integer
                enum:
                  - 42
      responses:
        '204':
          description: OK
