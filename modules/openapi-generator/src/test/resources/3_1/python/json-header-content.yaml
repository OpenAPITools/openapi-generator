openapi: 3.1.0

info:
  title: JSON header content test
  version: 1.0.0

paths:
  /test:
    post:
      operationId: testJsonHeader
      parameters:
        - name: X-Json-Arg
          in: header
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeaderArg'

        - name: X-Plain-Arg
          in: header
          required: false
          schema:
            type: string

      responses:
        '204':
          description: No content

components:
  schemas:
    HeaderArg:
      type: object
      properties:
        path:
          type: string
        recursive:
          type: boolean
