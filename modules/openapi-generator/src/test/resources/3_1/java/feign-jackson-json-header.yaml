openapi: 3.1.0
info:
  title: Feign JSON header
  version: 1.0.0
paths:
  /metadata:
    get:
      operationId: getMetadata
      parameters:
        - name: X-Json-Arg
          in: header
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeaderArg'
        - name: X-Plain
          in: header
          schema:
            type: string
      responses:
        '204':
          description: Success
components:
  schemas:
    HeaderArg:
      type: object
      properties:
        path:
          type: string
        optionalValue:
          type: string
