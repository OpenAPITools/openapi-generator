name: Samples Ruby 

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      build_changed: ${{ steps.build.outputs.has_changes }}
      build_matrix: ${{ steps.build.outputs.matrix }}
      build_samples: ${{ steps.build.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: build
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-ruby.build
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  build:
    needs: setup
    if: ${{ needs.setup.outputs.build_changed == 'true' }}
    name: Build Ruby
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node.js
        uses: actions/setup-node@v7
      - name: Run echo server
        run: |
          git clone https://github.com/wing328/http-echo-server -b openapi-generator-test-server
          (cd http-echo-server && npm install && npm start &)
      - uses: actions/setup-ruby@v1
        with:
          ruby-version: 3.0
          bundler-cache: true
      - name: Install bundle
        working-directory: ${{ matrix.sample }}
        run: bundle install
      - name: Run rspec
        working-directory: ${{ matrix.sample }}
        run: rspec
