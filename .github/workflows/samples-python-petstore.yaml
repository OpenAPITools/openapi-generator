name: "Python Client: Petstore"

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      validate_pyproject_toml_changed: ${{ steps.validate_pyproject_toml.outputs.has_changes }}
      validate_pyproject_toml_matrix: ${{ steps.validate_pyproject_toml.outputs.matrix }}
      validate_pyproject_toml_samples: ${{ steps.validate_pyproject_toml.outputs.samples }}
      build_changed: ${{ steps.build.outputs.has_changes }}
      build_matrix: ${{ steps.build.outputs.matrix }}
      build_samples: ${{ steps.build.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: validate_pyproject_toml
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-python-petstore.validate-pyproject-toml
          mode: ${{ vars.CI_SELECTION_MODE_PILOT || vars.CI_SELECTION_MODE || 'shadow' }}
      - id: build
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-python-petstore.build
          mode: ${{ vars.CI_SELECTION_MODE_PILOT || vars.CI_SELECTION_MODE || 'shadow' }}

  validate-pyproject-toml:
    needs: setup
    if: ${{ needs.setup.outputs.validate_pyproject_toml_changed == 'true' }}
    name: Validate pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install validator
        run: pip install 'validate-pyproject[all]'
      - name: Validate
        run: validate-pyproject samples/openapi3/client/petstore/python/pyproject.toml
  build:
    needs: setup
    if: ${{ needs.setup.outputs.build_changed == 'true' }}
    name: Test Python client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    services:
      petstore-api:
        image: swaggerapi/petstore
        ports:
          - 80:8080
        env:
          SWAGGER_HOST: http://petstore.swagger.io
          SWAGGER_BASE_PATH: /v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-python-${{ steps.py.outputs.python-version }}-
          path: |
            ~/.cache/pypoetry/virtualenvs/
            ~/.local/pipx/venvs/poetry/
            .mypy_cache/

      - name: Install via pip
        working-directory: ${{ matrix.sample }}
        run: pip install -r requirements.txt

      - name: Install poetry
        run: pipx install --python '${{ steps.py.outputs.python-path }}' poetry

      - name: Install via poetry
        working-directory: ${{ matrix.sample }}
        run: poetry install

      - name: Test
        working-directory: ${{ matrix.sample }}
        run: poetry run pytest -v

      - name: mypy
        working-directory: ${{ matrix.sample }}
        run: poetry run mypy
