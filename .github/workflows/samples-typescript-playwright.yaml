name: Samples TypeScript Playwright Client

on:
  push:
    paths:
      - samples/client/petstore/typescript-playwright/**
      - .github/workflows/samples-typescript-playwright.yaml
  pull_request:
    paths:
      - samples/client/petstore/typescript-playwright/**
      - .github/workflows/samples-typescript-playwright.yaml
jobs:
  build:
    name: Build TypeScript Playwright client
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18.x"
          - "20.x"
          - "22.x"
        sample:
          - samples/client/petstore/typescript-playwright/
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run echo server
        # The generated tests issue real HTTP requests and assert on the response
        # status. Point them at wing328's echo server (which answers 200 to any
        # request) so the Playwright client is exercised at runtime, deterministically.
        run: |
          git clone https://github.com/wing328/http-echo-server -b openapi-generator-test-server
          (cd http-echo-server && git checkout 15a684c41d4de692878636f47fcc1670af309a0f && npm install && npm start &)
      - name: npm install
        working-directory: ${{ matrix.sample }}
        run: npm install
      - name: Type-check generated client and tests
        working-directory: ${{ matrix.sample }}
        run: npm run typecheck
      - name: Test
        working-directory: ${{ matrix.sample }}
        env:
          BASE_URL: http://localhost:3000
        run: npm test
