name: Samples Rust Clients

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      build_changed: ${{ steps.build.outputs.has_changes }}
      build_matrix: ${{ steps.build.outputs.matrix }}
      build_samples: ${{ steps.build.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: build
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-rust-client.build
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  build:
    needs: setup
    if: ${{ needs.setup.outputs.build_changed == 'true' }}
    name: Build Rust
    runs-on: ubuntu-latest
    services:
      petstore-api:
        image: swaggerapi/petstore
        ports:
          - 80:8080
        env:
          SWAGGER_HOST: http://petstore.swagger.io
          SWAGGER_BASE_PATH: /v2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false # Don't cache workspace target directories as they don't exist
          cache-directories:
            ${{ matrix.sample }}/target
          workspaces: |
            ${{ matrix.sample }}/output/*

      - name: Build
        working-directory: ${{ matrix.sample }}
        run: cargo build --all-targets --all-features
      - name: Tests
        working-directory: ${{ matrix.sample }}
        run: |
          set -e

          # Iterate through each example and test various features
          for package in $(find . -maxdepth 1 -mindepth 1 -type d)
          do
            # Not all versions have a client example
            if test -f examples/client/main.rs; then
              cargo build --example client --features="client"
            fi

            # Test the CLI works if present
            if test -f bin/cli.rs; then
              cargo build --bin ${package##*/} --features cli
              target/debug/${package##*/} --help
            fi
            cargo fmt
            cargo test
            cargo clippy
            cargo doc
          done
