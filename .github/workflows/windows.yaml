name: Windows tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - '[5-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - '[5-9]+.[0-9]+.x'

jobs:
  setup:
    name: Select changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_changed: ${{ steps.build.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/compute-matrix
        id: build
        with:
          suite: windows.build
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  build:
    name: Build
    needs: setup
    if: needs.setup.outputs.build_changed == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        java: [11, 17]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: gradle
      - name: Cache maven dependencies
        uses: actions/cache@v6
        env:
          cache-name: cache-maven-repository
        with:
          path: |
            ~/.m2/repository
            ~/.gradle
            !~/.gradle/caches/*/plugin-resolution/
            !~/.m2/repository/org/openapitools/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
      - name: Setup Maven
        uses: s4u/setup-maven-action@v1.21.0
        with:
          java-version: ${{ matrix.java }}
          maven-version: 3.8.8
      - name: Run maven
        run: ./mvnw clean --no-snapshot-updates --batch-mode --quiet install
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - name: Test Template Retrieval
        run: |
          cd modules/openapi-generator-cli/target
          # generator names containing "-" caused problems in the past, see https://github.com/OpenAPITools/openapi-generator/issues/9528
          java -jar ./openapi-generator-cli.jar author template --verbose  -g jaxrs-spec --library quarkus
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.14.3'
      - name: Gradle tests
        run: |
          gradle -b modules/openapi-generator-gradle-plugin/samples/local-spec/build.gradle buildGoSdk --stacktrace
