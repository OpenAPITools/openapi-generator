name: Samples C# .Net 8 Client

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      build_changed: ${{ steps.build.outputs.has_changes }}
      build_matrix: ${{ steps.build.outputs.matrix }}
      build_samples: ${{ steps.build.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: build
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-dotnet8-client.build
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  build:
    needs: setup
    if: ${{ needs.setup.outputs.build_changed == 'true' }}
    name: Build .Net clients
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build
        working-directory: ${{ matrix.sample }}
        run: dotnet build Org.OpenAPITools.sln
