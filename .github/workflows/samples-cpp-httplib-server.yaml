name: Samples cpp httplib server

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:

env:
  GRADLE_VERSION: 6.9

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      build_changed: ${{ steps.build.outputs.has_changes }}
      build_matrix: ${{ steps.build.outputs.matrix }}
      build_samples: ${{ steps.build.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: build
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-cpp-httplib-server.build
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  build:
    needs: setup
    if: ${{ needs.setup.outputs.build_changed == 'true' }}
    name: Build cpp httplib server
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev cmake

      - name: Install dependencies (macOS)
        if: matrix.os == 'macOS-latest'
        run: |
          brew install openssl zlib cmake

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install openssl:x64-windows zlib:x64-windows
        shell: cmd
        timeout-minutes: 20

      - name: Build
        working-directory: ${{ matrix.sample }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -S . -B build
          fi
          cmake --build build --verbose
        shell: bash