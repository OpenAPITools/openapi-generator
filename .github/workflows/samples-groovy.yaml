name: Samples Groovy

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:

env:
  GRADLE_VERSION: 6.9

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      build_changed: ${{ steps.build.outputs.has_changes }}
      build_matrix: ${{ steps.build.outputs.matrix }}
      build_samples: ${{ steps.build.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: build
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-groovy.build
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  build:
    needs: setup
    if: ${{ needs.setup.outputs.build_changed == 'true' }}
    name: Build Groovy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.build_matrix) }}
    services:
      petstore-api:
        image: swaggerapi/petstore
        ports:
          - 80:8080
        env:
          SWAGGER_HOST: http://petstore.swagger.io
          SWAGGER_BASE_PATH: /v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: 8
          cache: gradle
      - name: Cache maven dependencies
        uses: actions/cache@v6
        env:
          cache-name: maven-repository
        with:
          path: |
            ~/.gradle
          key: ${{ runner.os }}-${{ github.job }}-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
      - name: Install Gradle wrapper
        uses: eskatos/gradle-command-action@v3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          build-root-directory: ${{ matrix.sample }}
          arguments: wrapper
      - name: Build & Test
        working-directory: ${{ matrix.sample }}
        run: ./gradlew build
