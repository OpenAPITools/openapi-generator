name: Java Feign Jackson headers
on:
  push:
    paths:
      - 'modules/openapi-generator/src/main/java/org/openapitools/codegen/languages/JavaClientCodegen.java'
      - 'modules/openapi-generator/src/main/resources/Java/**'
      - 'modules/openapi-generator/src/test/resources/3_1/java/feign-jackson-json-header.yaml'
      - 'modules/openapi-generator/src/test/resources/3_1/java/FeignJacksonHeaderRuntimeTest.java'
      - '.github/workflows/test-java-feign-jackson-headers.yaml'
  pull_request:
    paths:
      - 'modules/openapi-generator/src/main/java/org/openapitools/codegen/languages/JavaClientCodegen.java'
      - 'modules/openapi-generator/src/main/resources/Java/**'
      - 'modules/openapi-generator/src/test/resources/3_1/java/feign-jackson-json-header.yaml'
      - 'modules/openapi-generator/src/test/resources/3_1/java/FeignJacksonHeaderRuntimeTest.java'
      - '.github/workflows/test-java-feign-jackson-headers.yaml'
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -pl modules/openapi-generator-cli -am -DskipTests package
      - run: |
          java -jar modules/openapi-generator-cli/target/openapi-generator-cli.jar generate -g java --library feign -i modules/openapi-generator/src/test/resources/3_1/java/feign-jackson-json-header.yaml -o /tmp/feign-test --additional-properties=serializationLibrary=jackson --global-property=apis,models,supportingFiles,apiTests=false,modelTests=false
          mkdir -p /tmp/feign-test/src/test/java
          cp modules/openapi-generator/src/test/resources/3_1/java/FeignJacksonHeaderRuntimeTest.java /tmp/feign-test/src/test/java/
          mvn -B -f /tmp/feign-test/pom.xml -Dtest=FeignJacksonHeaderRuntimeTest test
