name: Python Connexion generated code

on:
  push:
    paths:
      - samples/server/petstore/python-flask/**
      - samples/server/petstore/python-flask-connexion3/**
      - samples/server/petstore/python-aiohttp-srclayout/**
      - samples/server/petstore/python-blueplanet/**
      - bin/utils/check-python-connexion-generated.py
      - bin/utils/test-python-connexion-generated.sh
      - modules/openapi-generator/src/test/resources/3_0/python/connexion-json-header-test-values.yaml
      - modules/openapi-generator/src/test/resources/3_0/python/info-title-special-chars.yaml
      - .github/workflows/samples-python-connexion-generated-code.yaml
  pull_request:
    paths:
      - samples/server/petstore/python-flask/**
      - samples/server/petstore/python-flask-connexion3/**
      - samples/server/petstore/python-aiohttp-srclayout/**
      - samples/server/petstore/python-blueplanet/**
      - bin/utils/check-python-connexion-generated.py
      - bin/utils/test-python-connexion-generated.sh
      - modules/openapi-generator/src/test/resources/3_0/python/connexion-json-header-test-values.yaml
      - modules/openapi-generator/src/test/resources/3_0/python/info-title-special-chars.yaml
      - .github/workflows/samples-python-connexion-generated-code.yaml
jobs:
  build:
    name: Check generated Python Connexion server code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'temurin'
      - name: Cache maven dependencies
        uses: actions/cache@v6
        env:
          cache-name: cache-maven-repository
        with:
          path: |
            ~/.m2/repository
            ~/.gradle
            !~/.gradle/caches/*/plugin-resolution/
            !~/.m2/repository/org/openapitools/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Build openapi-generator-cli
        run: ./mvnw -B -ntp -DskipTests -pl modules/openapi-generator-cli -am package
      - name: Test
        run: /bin/bash ./bin/utils/test-python-connexion-generated.sh
