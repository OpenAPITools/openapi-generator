name: Samples Elixir

on:
  push:
    paths:
      - .github/workflows/samples-elixir.yaml
      - samples/client/petstore/elixir/**
      - samples/client/petstore/elixir-req/**
  pull_request:
    paths:
      - .github/workflows/samples-elixir.yaml
      - samples/client/petstore/elixir/**
      - samples/client/petstore/elixir-req/**
jobs:
  build:
    runs-on: ubuntu-26.04
    name: OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }} / ${{ matrix.sample }}
    strategy:
      fail-fast: false
      matrix:
        otp: ['26', '27', '28', '29']
        elixir: ['1.18', '1.19', '1.20']
        sample: [elixir, elixir-req]
        # https://hexdocs.pm/elixir/compatibility-and-deprecations.html
        exclude:
          - otp: '26'
            elixir: '1.20'
          - otp: '28'
            elixir: '1.18'
          - otp: '29'
            elixir: '1.18'
          - otp: '29'
            elixir: '1.19'
    services:
      petstore-api:
        image: swaggerapi/petstore
        ports:
          - 80:8080
        env:
          SWAGGER_HOST: http://petstore.swagger.io
          SWAGGER_BASE_PATH: /v2
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: mix deps.get
        run: mix deps.get
        working-directory: samples/client/petstore/${{ matrix.sample }}
      - name: mix test
        run: mix test
        working-directory: samples/client/petstore/${{ matrix.sample }}
