name: Docker tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - '[5-9]+.[0-9]+.x'
  pull_request:

jobs:
  setup:
    name: Select changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_changed: ${{ steps.build.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: ./.github/actions/compute-matrix
        id: build
        with:
          suite: docker.build
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  build:
    name: 'Build: Docker'
    needs: setup
    if: needs.setup.outputs.build_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Test run-in-docker.sh
        shell: bash
        run: |
          sed -i 's/ -it / /g' run-in-docker.sh
          ./run-in-docker.sh mvn -B clean install

      - name: Build Dockerfile
        shell: bash
        run: docker build .

      - name: Build modules/openapi-generator-online
        shell: bash
        run: |
          docker build modules/openapi-generator-online/ -t test
      - name: Build and test modules/openapi-generator-cli
        shell: bash
        run: |
          cp docker-entrypoint.sh ./modules/openapi-generator-cli 
          docker build modules/openapi-generator-cli/ -t cli-test
          docker run --rm -v "${PWD}:/local" cli-test generate \
          -i https://raw.githubusercontent.com/openapitools/openapi-generator/master/modules/openapi-generator/src/test/resources/3_0/petstore.yaml \
          -g go \
          -o /local/out/go
