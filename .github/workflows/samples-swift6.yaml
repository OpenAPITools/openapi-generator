name: Samples Swift 6

on:
  push:
    paths:
      - samples/client/petstore/swift6/**
  pull_request:
    paths:
      - samples/client/petstore/swift6/**

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        sample:
          - samples/client/petstore/swift6/default
          #- samples/client/petstore/swift6/alamofireLibrary
          #- samples/client/petstore/swift6/apiNonStaticMethod
          #- samples/client/petstore/swift6/asyncAwaitLibrary
          #- samples/client/petstore/swift6/combineDeferredLibrary
          #- samples/client/petstore/swift6/combineLibrary
          #- samples/client/petstore/swift6/objcCompatible
          #- samples/client/petstore/swift6/oneOf
          #- samples/client/petstore/swift6/promisekitLibrary
          #- samples/client/petstore/swift6/resultLibrary
          #- samples/client/petstore/swift6/rxswiftLibrary
          #- samples/client/petstore/swift6/urlsessionLibrary
          #- samples/client/petstore/swift6/validation
          ## NOTE: disabled like its swift5 counterpart, vaporLibrary doesnt build when adding this CI config
          #- samples/client/petstore/swift6/vaporLibrary
        #include:
        # the ubuntu build runs in the official swift image: swift-actions/setup-swift
        # fails on current ubuntu runners while verifying the toolchain signature
        #- os: ubuntu-latest
        #  sample: samples/client/petstore/swift6/alamofireLibrary
        #  container: swift:6.2-noble
        #- os: ubuntu-latest
        #  sample: samples/client/petstore/swift6/urlsessionLibrary
        #  container: swift:6.2-noble
    services:
      petstore-api:
        image: swaggerapi/petstore
        ports:
          - 80:8080
        env:
          SWAGGER_HOST: http://petstore.swagger.io
          SWAGGER_BASE_PATH: /v2        
    name#: Build Swift 6 samples
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - name: Add hosts to /etc/hosts
        run: |
            sudo echo "127.0.0.1 petstore.swagger.io" | sudo tee -a /etc/hosts
      - name: Build
        working-directory: ${{ matrix.sample }}
        run: swift build
      - name: Test
        working-directory: ${{ matrix.sample }}/SwaggerClientTests
        run: xcodebuild clean build-for-testing -workspace "SwaggerClient.xcworkspace" -scheme "SwaggerClient" -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" && xcodebuild test-without-building -workspace "SwaggerClient.xcworkspace" -scheme "SwaggerClient" -destination "platform=iOS Simulator,name=iPhone 17,OS=latest"
