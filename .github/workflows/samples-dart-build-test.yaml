name: Samples Dart (build, test)

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      test_changed: ${{ steps.test.outputs.has_changes }}
      test_matrix: ${{ steps.test.outputs.matrix }}
      test_samples: ${{ steps.test.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: test
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-dart-build-test.test
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  test:
    needs: setup
    if: ${{ needs.setup.outputs.test_changed == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: pub get
        working-directory: ${{ matrix.sample }}
        run: dart pub get

      - name: build_runner build
        working-directory: ${{ matrix.sample }}
        run: dart run build_runner build

      - name: test
        working-directory: ${{ matrix.sample }}
        run: dart test
