name: Samples Dart

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'
  pull_request:
    branches:
      - 'master'
      - '[5-9]+.[0-9]+.x'

jobs:
  setup:
    name: Select affected samples
    runs-on: ubuntu-latest
    outputs:
      tests_dart_changed: ${{ steps.tests_dart.outputs.has_changes }}
      tests_dart_matrix: ${{ steps.tests_dart.outputs.matrix }}
      tests_dart_samples: ${{ steps.tests_dart.outputs.samples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: tests_dart
        uses: ./.github/actions/compute-matrix
        with:
          suite: samples-dart.tests-dart
          mode: ${{ vars.CI_SELECTION_MODE || 'shadow' }}

  tests-dart:
    needs: setup
    if: ${{ needs.setup.outputs.tests_dart_changed == 'true' }}
    name: Tests Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: 11
          cache: maven
      - name: Cache test dependencies
        uses: actions/cache@v6
        env:
          cache-name: pub-cache
        with:
          path: $PUB_CACHE
          key: ${{ runner.os }}-${{ github.job }}-${{ env.cache-name }}-${{ hashFiles('samples/**/pubspec.*') }}
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 2.15.0
      - name: Run tests
        uses: ./.github/actions/run-samples
        with:
          name: samples.dart
